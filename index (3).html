<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9dceb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #sahne { position: fixed; inset: 0; touch-action: none; }
  #sahne canvas { display: block; }
  :root { --altin: #d4a017; --panel: linear-gradient(#2a3140f2, #1a1f29f2); }

  /* Üst bilgi çubuğu */
  .ust { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: 8px 8px 0; pointer-events: none; }
  .kaynaklar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; max-width: 560px; }
  .kaynak {
    display: flex; align-items: center; gap: 5px; padding: 4px 6px 4px 4px; border-radius: 999px; min-width: 0;
    background: linear-gradient(#2a3140, #1a1f29); border: 2px solid var(--altin); color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3);
  }
  .kaynak .ik { font-size: 16px; width: 22px; text-align: center; flex: none; }
  .kaynak .sy { font-weight: 800; font-size: 13px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kaynak .br { height: 4px; border-radius: 2px; background: #0d1117; margin-top: 3px; overflow: hidden; }
  .kaynak .br i { display: block; height: 100%; background: linear-gradient(90deg, #f6c945, #ffdf70); width: 0; transition: width .4s; }
  .kaynak .ic { flex: 1; min-width: 0; }
  .ikinci { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .rozet { padding: 4px 10px; border-radius: 999px; background: linear-gradient(#2a3140, #1a1f29); border: 2px solid var(--altin);
    color: #fff; font-weight: 800; font-size: 12px; }

  /* Bina üstü etiketler */
  .etiket, .balon, .sayac { position: fixed; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; }
  .etiket { z-index: 3; background: rgba(17,21,29,.82); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px;
    border-radius: 10px; border: 1px solid rgba(212,160,23,.6); }
  .balon { z-index: 4; background: #fff; color: #3d2b1f; font-weight: 800; font-size: 13px; padding: 3px 9px; border-radius: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); animation: zipla 1s ease-in-out infinite; }
  .sayac { z-index: 4; background: #1a1f29e6; color: #ffd84a; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 10px;
    border: 1px solid var(--altin); }
  .sayac b { display: block; height: 3px; background: #0d1117; border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .sayac b i { display: block; height: 100%; background: #5fd068; }
  @keyframes zipla { 50% { margin-top: -5px; } }
  .ucan { position: fixed; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px;
    color: #ffd84a; text-shadow: 0 2px 0 #7a5200, 0 0 8px rgba(0,0,0,.5); animation: uc 1.1s ease-out forwards; }
  @keyframes uc { to { margin-top: -70px; opacity: 0; } }

  /* Alt kısım */
  #insaDugme { position: fixed; z-index: 6; right: 14px; bottom: 16px; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--altin); background: radial-gradient(circle at 40% 30%, #5fd068, #2c8a39); color: #fff; font-size: 28px;
    box-shadow: 0 5px 0 #1d5e26, 0 8px 18px rgba(0,0,0,.35); cursor: pointer; }
  #insaDugme:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d5e26; }
  #ipucu { position: fixed; z-index: 4; left: 12px; right: 90px; bottom: 22px; pointer-events: none; text-align: center;
    background: rgba(17,21,29,.75); color: #fff; font-size: 12px; padding: 8px 10px; border-radius: 12px; transition: opacity .4s; }

  .alt-panel {
    position: fixed; z-index: 7; left: 50%; bottom: 10px; width: min(96vw, 460px); transform: translate(-50%, 140%);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.15); padding: 12px 14px 14px; border-radius: 18px; color: #f3ead6;
    background: var(--panel); border: 2px solid var(--altin); box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .alt-panel.acik { transform: translate(-50%, 0); }
  .alt-panel h2 { margin: 0 34px 4px 0; font-size: 17px; color: #ffd84a; font-family: Georgia, "Times New Roman", serif; }
  .alt-panel p { margin: 3px 0; font-size: 13px; line-height: 1.35; opacity: .92; }
  .kapat { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.12); color: #fff; font-size: 15px; cursor: pointer; }
  .dugmeler { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .dugme { flex: 1; min-width: 90px; border: none; border-radius: 12px; padding: 11px 8px; font-size: 14px; font-weight: 800; cursor: pointer;
    background: linear-gradient(#5fd068, #36a144); color: #fff; box-shadow: 0 4px 0 #22702c; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
  .dugme:active { transform: translateY(3px); box-shadow: 0 1px 0 #22702c; }
  .dugme:disabled { background: linear-gradient(#8b8f98, #6c707a); box-shadow: 0 4px 0 #4a4d55; }
  .dugme.sari { background: linear-gradient(#ffd84a, #e0a812); color: #3d2b1f; box-shadow: 0 4px 0 #9c7208; text-shadow: none; }
  .dugme.mavi { background: linear-gradient(#5aa9e6, #2f78b7); box-shadow: 0 4px 0 #1f5281; }
  .dugme.kirmizi { background: linear-gradient(#e46a5e, #b8392d); box-shadow: 0 4px 0 #7c241c; }
  .maliyet { font-size: 12px; font-weight: 700; opacity: .95; }
  .maliyet .eksik { color: #ff8f8f; }
  .mesaj { min-height: 16px; margin-top: 6px; font-size: 12px; color: #ff8f8f; }

  /* Mağaza */
  #magaza .izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-top: 8px;
    max-height: 52vh; overflow-y: auto; padding-bottom: 2px; }
  .kart { background: rgba(255,255,255,.06); border: 1px solid rgba(212,160,23,.45); border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .kart:active { background: rgba(255,255,255,.12); }
  .kart.kapali { opacity: .45; }
  .kart .ki { font-size: 26px; }
  .kart .ka { font-weight: 800; font-size: 13px; margin: 2px 0; }
  .kart .ks { font-size: 11px; opacity: .75; }

  #yukleniyor { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #1a1f29; color: #ffd84a;
    font: 800 20px Georgia, serif; transition: opacity .5s; }
</style>
</head>
<body>
<div id="sahne"></div>

<div class="ust">
  <div class="kaynaklar" id="kaynaklar"></div>
  <div class="ikinci">
    <div class="rozet">🔨 <span id="insaatci">1/1</span></div>
    <div class="rozet">🏰 Sv <span id="kbSeviye">1</span></div>
  </div>
</div>

<div id="ipucu">Binaya dokun · Tek parmakla döndür · İki parmakla kaydır ve yakınlaş</div>
<button id="insaDugme" aria-label="İnşa et">🏗️</button>

<div id="panel" class="alt-panel">
  <button class="kapat" data-kapat>✕</button>
  <h2 id="pBaslik"></h2>
  <p id="pAciklama"></p>
  <div class="dugmeler" id="pDugmeler"></div>
  <div class="mesaj" id="pMesaj"></div>
</div>

<div id="magaza" class="alt-panel">
  <button class="kapat" data-kapat>✕</button>
  <h2>🏗️ İnşa Et</h2>
  <div class="izgara" id="magazaIzgara"></div>
</div>

<div id="yerlestirme" class="alt-panel">
  <h2 id="yBaslik"></h2>
  <p id="yAciklama"></p>
  <div class="dugmeler" id="yDugmeler"></div>
  <div class="mesaj" id="yMesaj"></div>
</div>

<div id="yukleniyor">Mini Empire</div>

<script>
// =====================================================================
// OYUN VERİLERİ: bütün denge ayarları burada.
// Her bina: boyut (kaç kare), seviye başına maliyet, inşa süresi (saniye) ve etkisi,
// limit = Belediye Binası seviyesine göre en fazla kaç tane yapılabileceği.
// =====================================================================
const KAYNAKLAR = {
  altin: { ad: "Altın", ikon: "🪙" },
  odun: { ad: "Odun", ikon: "🪵" },
  tas: { ad: "Taş", ikon: "🪨" },
  yemek: { ad: "Yemek", ikon: "🌾" },
};
const URETIM = [200, 400, 700, 1200, 2000];        // saatlik üretim (seviye 1..5)
const URETIM_DEPO = [500, 1000, 2000, 4000, 8000]; // binanın içinde birikebilecek en fazla miktar
const URETIM_SURE = [10, 60, 300, 900, 2400];

const TURLER = {
  koyBinasi: {
    kod: "k", ad: "Belediye Binası", ikon: "🏛️", boyut: 4, limit: [1, 1, 1, 1, 1],
    aciklama: "İmparatorluğunun merkezi. Seviyesi, diğer binaların ulaşabileceği en yüksek seviyeyi ve kaç bina yapabileceğini belirler.",
    seviyeler: [
      { maliyet: {}, sure: 0, kapasite: 1500 },
      { maliyet: { altin: 800, odun: 800, tas: 300 }, sure: 60, kapasite: 4000 },
      { maliyet: { altin: 3000, odun: 3000, tas: 1500, yemek: 1000 }, sure: 300, kapasite: 10000 },
      { maliyet: { altin: 9000, odun: 9000, tas: 5000, yemek: 3000 }, sure: 1200, kapasite: 25000 },
      { maliyet: { altin: 24000, odun: 24000, tas: 14000, yemek: 8000 }, sure: 3600, kapasite: 60000 },
    ],
  },
  altinMadeni: {
    kod: "a", ad: "Altın Madeni", ikon: "⛏️", boyut: 3, uretir: "altin", limit: [1, 2, 2, 3, 3],
    aciklama: "Altın üretir. Biriken altını toplamak için madene dokun.",
    seviyeler: [{ odun: 150 }, { odun: 400, tas: 100 }, { odun: 1200, tas: 500 }, { odun: 3500, tas: 1500 }, { odun: 9000, tas: 4000 }]
      .map((maliyet, i) => ({ maliyet, sure: URETIM_SURE[i], uretim: URETIM[i], depo: URETIM_DEPO[i] })),
  },
  kerestekampi: {
    kod: "o", ad: "Kereste Kampı", ikon: "🪓", boyut: 3, uretir: "odun", limit: [1, 2, 2, 3, 3],
    aciklama: "Ormandan odun keser. Odun binalar ve duvarlar için gerekir.",
    seviyeler: [{ altin: 150 }, { altin: 400 }, { altin: 1200, tas: 300 }, { altin: 3500, tas: 1000 }, { altin: 9000, tas: 3000 }]
      .map((maliyet, i) => ({ maliyet, sure: URETIM_SURE[i], uretim: URETIM[i], depo: URETIM_DEPO[i] })),
  },
  tasOcagi: {
    kod: "t", ad: "Taş Ocağı", ikon: "⚒️", boyut: 3, uretir: "tas", limit: [1, 1, 2, 2, 3],
    aciklama: "Taş çıkarır. Güçlü binalar ve taş duvarlar için gerekir.",
    seviyeler: [{ altin: 200, odun: 100 }, { altin: 500, odun: 300 }, { altin: 1500, odun: 900 }, { altin: 4000, odun: 2500 }, { altin: 10000, odun: 7000 }]
      .map((maliyet, i) => ({ maliyet, sure: URETIM_SURE[i], uretim: [150, 300, 550, 900, 1500][i], depo: [400, 800, 1600, 3200, 6400][i] })),
  },
  ciftlik: {
    kod: "c", ad: "Çiftlik", ikon: "🌾", boyut: 3, uretir: "yemek", limit: [1, 1, 2, 2, 3],
    aciklama: "Yemek üretir. Yemek büyük yükseltmeler ve ileride ordun için gerekecek.",
    seviyeler: [{ altin: 100, odun: 150 }, { altin: 300, odun: 400 }, { altin: 1000, odun: 1200 }, { altin: 3000, odun: 3500 }, { altin: 8000, odun: 9000 }]
      .map((maliyet, i) => ({ maliyet, sure: URETIM_SURE[i], uretim: URETIM[i], depo: URETIM_DEPO[i] })),
  },
  depo: {
    kod: "p", ad: "Depo", ikon: "📦", boyut: 3, limit: [1, 1, 2, 2, 3],
    aciklama: "Her kaynaktan saklayabileceğin miktarı artırır.",
    seviyeler: [
      { maliyet: { altin: 300, odun: 300 }, sure: 20, ekKapasite: 1000 },
      { maliyet: { altin: 1000, odun: 1000, tas: 300 }, sure: 120, ekKapasite: 2500 },
      { maliyet: { altin: 3000, odun: 3000, tas: 1200 }, sure: 600, ekKapasite: 6000 },
      { maliyet: { altin: 8000, odun: 8000, tas: 4000 }, sure: 1800, ekKapasite: 15000 },
      { maliyet: { altin: 20000, odun: 20000, tas: 10000 }, sure: 3600, ekKapasite: 35000 },
    ],
  },
  insaatci: {
    kod: "i", ad: "İnşaatçı Kulübesi", ikon: "🔨", boyut: 2, limit: [2, 2, 3, 3, 4],
    aciklama: "Her kulübe bir inşaatçı demek. İnşaatçı sayısı aynı anda kaç inşaat yapabileceğini belirler.",
    seviyeler: [{ maliyet: { altin: 500 }, sure: 0 }],
    adetMaliyeti: [{}, { altin: 500 }, { altin: 2000 }, { altin: 6000 }],
  },
  duvar: {
    kod: "d", ad: "Duvar", ikon: "🧱", boyut: 1, limit: [20, 40, 60, 90, 120], duvar: true,
    aciklama: "Köyünü korur. Parmağınla sürükleyerek çiz, köşeler kendiliğinden birleşir.",
    seviyeAdlari: ["Ahşap çit", "Güçlendirilmiş ahşap duvar", "Taş duvar", "Güçlendirilmiş taş duvar", "Demir takviyeli duvar"],
    seviyeler: [{ odun: 50 }, { odun: 200 }, { tas: 400 }, { tas: 1000, altin: 500 }, { tas: 2500, altin: 1500 }].map((maliyet) => ({ maliyet, sure: 0 })),
  },
  kapi: {
    kod: "g", ad: "Kapı", ikon: "🚪", boyut: 1, limit: [1, 1, 2, 2, 3], duvar: true,
    aciklama: "Duvarların arasına koyduğun giriş. Duvarlara otomatik bağlanır.",
    seviyeler: [{ odun: 200 }, { odun: 600 }, { tas: 1000 }, { tas: 2500, altin: 1000 }, { tas: 6000, altin: 3000 }].map((maliyet) => ({ maliyet, sure: 0 })),
  },
};
const MAGAZA_SIRASI = ["altinMadeni", "kerestekampi", "tasOcagi", "ciftlik", "depo", "insaatci", "duvar", "kapi"];
const KOD_TUR = Object.fromEntries(Object.entries(TURLER).map(([tur, t]) => [t.kod, tur]));

const IZGARA = 24;   // harita 24x24 kare
const KARE = 2;      // bir karenin dünyadaki boyu

// =====================================================================
// DURUM VE KAYIT
// =====================================================================
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.disableVerticalSwipes?.(); // köyü sürüklerken uygulama kapanmasın

const simdi = () => Date.now();
let durum = null;   // { kaynak: {...}, binalar: [{ id, tur, sv, i, j, rot, toplama, bitis, hedef }] }
let sonrakiId = 1;

function yeniOyun() {
  return {
    kaynak: { altin: 1000, odun: 1000, tas: 500, yemek: 500 },
    binalar: [
      { tur: "koyBinasi", sv: 1, i: 10, j: 9 },
      { tur: "altinMadeni", sv: 1, i: 15, j: 9, toplama: simdi() },
      { tur: "insaatci", sv: 1, i: 7, j: 10 },
    ],
  };
}
// İlk sürümdeki (tek Köy Binası + Altın Madeni) kayıtları yeni düzene taşı
function eskiKaydiCevir(eski) {
  const d = yeniOyun();
  d.kaynak.altin = Math.max(eski.altin || 0, 0);
  d.binalar[0].sv = eski.koyBinasi || 1;
  d.binalar[1].sv = Math.min(eski.altinMadeni || 1, d.binalar[0].sv);
  d.binalar[1].toplama = eski.sonToplama || simdi();
  return d;
}
// Telegram bulut deposu anahtar başına 4096 karakter alır; kaydı sıkıştırıp parçalara bölüyoruz.
function paketle() {
  const sn = (t) => (t ? Math.round(t / 1000) : 0);
  const b = durum.binalar.map((x) => {
    const a = [TURLER[x.tur].kod, x.sv, x.i, x.j, x.rot || 0, sn(x.toplama), sn(x.bitis), x.hedef || 0];
    while (a.length > 4 && !a[a.length - 1]) a.pop();
    return a;
  });
  return JSON.stringify({ v: 2, k: durum.kaynak, b });
}
function ac(metin) {
  const p = JSON.parse(metin);
  if (p.v !== 2) return eskiKaydiCevir(p);
  const ms = (s) => (s ? s * 1000 : 0);
  return {
    kaynak: { altin: 0, odun: 0, tas: 0, yemek: 0, ...p.k },
    binalar: p.b.map(([kod, sv, i, j, rot = 0, toplama = 0, bitis = 0, hedef = 0]) =>
      ({ tur: KOD_TUR[kod], sv, i, j, rot, toplama: ms(toplama) || simdi(), bitis: ms(bitis), hedef })).filter((x) => x.tur),
  };
}
const BULUT = !!(tg?.CloudStorage && tg.initData);
let kayitZamanlayici = null;
function kaydet() {
  clearTimeout(kayitZamanlayici);
  kayitZamanlayici = setTimeout(() => {
    const veri = paketle();
    try { localStorage.setItem("imparatorluk", veri); } catch (e) {}
    if (!BULUT) return;
    const parcalar = veri.match(/[\s\S]{1,4000}/g);
    parcalar.forEach((p, n) => tg.CloudStorage.setItem("imp_" + n, p));
    tg.CloudStorage.setItem("imp_say", String(parcalar.length));
  }, 300);
}
function yukle(bitti) {
  const uygula = (metin) => {
    try { durum = metin ? ac(metin) : yeniOyun(); } catch (e) { durum = yeniOyun(); }
    durum.binalar.forEach((b) => (b.id = sonrakiId++));
    bitti();
  };
  const yerel = () => { try { return localStorage.getItem("imparatorluk") || localStorage.getItem("koy"); } catch (e) { return null; } };
  if (!BULUT) return uygula(yerel());
  tg.CloudStorage.getItem("imp_say", (h, say) => {
    const n = parseInt(say);
    if (h || !n) return tg.CloudStorage.getItem("koy", (h2, eski) => uygula(h2 ? null : eski || null));
    const anahtarlar = [...Array(n).keys()].map((k) => "imp_" + k);
    tg.CloudStorage.getItems(anahtarlar, (h3, sonuc) => uygula(h3 ? yerel() : anahtarlar.map((a) => sonuc[a] || "").join("")));
  });
}

// ---- Kurallar ----
const kb = () => durum.binalar.find((b) => b.tur === "koyBinasi");
const kbSv = () => kb().sv;
const seviye = (b, sv = b.sv) => TURLER[b.tur].seviyeler[sv - 1];
const adet = (tur) => durum.binalar.filter((b) => b.tur === tur).length;
const limit = (tur) => TURLER[tur].limit[kbSv() - 1];
function kapasite() {
  let k = TURLER.koyBinasi.seviyeler[kbSv() - 1].kapasite;
  for (const b of durum.binalar) if (b.tur === "depo" && b.sv > 0) k += seviye(b).ekKapasite;
  return k;
}
const insaatciSayisi = () => adet("insaatci");
const mesgulInsaatci = () => durum.binalar.filter((b) => b.bitis).length;
function yeniMaliyet(tur) {
  const t = TURLER[tur];
  if (t.adetMaliyeti) return t.adetMaliyeti[Math.min(adet(tur), t.adetMaliyeti.length - 1)];
  return t.seviyeler[0].maliyet;
}
const yeterli = (m) => Object.entries(m).every(([k, v]) => durum.kaynak[k] >= v);
function harca(m) { for (const [k, v] of Object.entries(m)) durum.kaynak[k] -= v; }
function maliyetHtml(m) {
  const p = Object.entries(m).map(([k, v]) => `<span class="${durum.kaynak[k] < v ? "eksik" : ""}">${KAYNAKLAR[k].ikon} ${v.toLocaleString("tr-TR")}</span>`);
  return p.length ? p.join(" ") : "Ücretsiz";
}
function sureYazi(sn) {
  sn = Math.max(0, Math.ceil(sn));
  if (sn < 60) return sn + " sn";
  if (sn < 3600) return Math.floor(sn / 60) + " dk " + (sn % 60 ? (sn % 60) + " sn" : "");
  return Math.floor(sn / 3600) + " sa " + Math.floor((sn % 3600) / 60) + " dk";
}
function bekleyen(b) {
  const t = TURLER[b.tur];
  if (!t.uretir || b.sv < 1 || b.bitis) return 0;
  const s = seviye(b);
  return Math.min(Math.floor((simdi() - b.toplama) / 3600000 * s.uretim), s.depo);
}

// =====================================================================
// 3D SAHNE
// =====================================================================
const kap = document.getElementById("sahne");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
kap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SIS = new THREE.Color("#c9dceb").convertSRGBToLinear();
scene.background = SIS;

// ---- Yardımcılar (geometriler önbellekte tutulur, yüzlerce duvar parçası hafif kalsın) ----
const malzemeler = {};
function mat(renk, ek = {}) {
  const anahtar = renk + JSON.stringify(ek);
  if (!malzemeler[anahtar]) {
    const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(renk).convertSRGBToLinear(), roughness: 0.85, flatShading: true, ...ek });
    if (ek.emissive) m.emissive = new THREE.Color(ek.emissive).convertSRGBToLinear();
    malzemeler[anahtar] = m;
  }
  return malzemeler[anahtar];
}
const R = {
  tas: mat("#3b404b"), koyuTas: mat("#2a2e36"), acikTas: mat("#6d7482"), kesmeTas: mat("#9aa0ab"), kar: mat("#f4f8fc", { roughness: 1 }),
  tahta: mat("#6b4526"), koyuTahta: mat("#47301c"), acikTahta: mat("#9a6a3c"),
  altin: mat("#e2a91b", { metalness: 0.6, roughness: 0.35, emissive: "#5a3c00" }),
  altinParlak: mat("#ffcf3a", { metalness: 0.4, roughness: 0.3, emissive: "#a86a00" }), siyah: mat("#16181d"),
  demir: mat("#4b515c", { metalness: 0.7, roughness: 0.4 }),
  alev: mat("#ffb347", { emissive: "#ff7a00", roughness: 1 }), pencere: mat("#ffc56b", { emissive: "#ff9a2e" }),
  kumas: mat("#c9b98f"), kirmizi: mat("#a8382c"), beyaz: mat("#ece6d8"), bugday: mat("#d8b24a"), yesil: mat("#4f7a3a"),
};
const geoOnbellek = {};
function geo(anahtar, yap) { return geoOnbellek[anahtar] || (geoOnbellek[anahtar] = yap()); }
function parca(g, malzeme, x = 0, y = 0, z = 0, ebeveyn) {
  const m = new THREE.Mesh(g, malzeme);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (ebeveyn) ebeveyn.add(m);
  return m;
}
const kutu = (w, h, d, m, x, y, z, e) => parca(geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)), m, x, y, z, e);
const silindir = (rt, rb, h, s, m, x, y, z, e) => parca(geo(`c${rt},${rb},${h},${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s)), m, x, y, z, e);
const koni = (r, h, s, m, x, y, z, e) => parca(geo(`k${r},${h},${s}`, () => new THREE.ConeGeometry(r, h, s)), m, x, y, z, e);
const kaya = (r, m, x, y, z, e) => parca(geo(`d${r}`, () => new THREE.DodecahedronGeometry(r, 0)), m, x, y, z, e);
function karliKutu(w, h, d, m, x, y, z, e) {
  kutu(w, h, d, m, x, y + h / 2, z, e);
  kutu(w + 0.12, 0.16, d + 0.12, R.kar, x, y + h + 0.06, z, e);
}
function cati(w, d, h, m, x, y, z, e) { // üçgen çatı: w genişlik (x), d uzunluk (z), h yükseklik
  const r = w / Math.sqrt(3), s = h / (1.5 * r);
  const g = geo(`r${w},${d}`, () => new THREE.CylinderGeometry(r, r, d, 3));
  const c = parca(g, m, x, y + 0.5 * r * s, z, e); c.rotation.x = -Math.PI / 2; c.scale.set(1, 1, s);
  const k = parca(g, R.kar, x, y + 0.5 * r * s + h * 0.22, z, e); k.rotation.x = -Math.PI / 2; k.scale.set(0.72, 1.03, s * 0.72);
  return c;
}

const alevler = [];
function mesale(x, y, z, e, isik = false) {
  silindir(0.07, 0.09, 0.9, 6, R.koyuTahta, x, y + 0.45, z, e);
  kutu(0.28, 0.18, 0.28, R.altin, x, y + 0.95, z, e);
  const a = koni(0.17, 0.5, 6, R.alev, x, y + 1.25, z, e); a.castShadow = false;
  const kayit = { mesh: a, faz: Math.random() * 10 };
  if (isik) { const l = new THREE.PointLight(new THREE.Color("#ff9a3c"), 1.2, 9, 2); l.position.set(x, y + 1.6, z); e.add(l); kayit.isik = l; }
  alevler.push(kayit);
}
function bayrak(x, y, z, e, boy = 2.2) {
  silindir(0.05, 0.05, boy, 6, R.siyah, x, y + boy / 2, z, e);
  kutu(0.9, 0.6, 0.04, R.siyah, x + 0.47, y + boy - 0.35, z, e);
  koni(0.16, 0.26, 3, R.altin, x + 0.47, y + boy - 0.35, z + 0.04, e).rotation.x = Math.PI / 2;
}

const YARI = IZGARA * KARE / 2; // 24
(function arazi() {
  const g = new THREE.PlaneGeometry(220, 220, 90, 90);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), d = Math.max(Math.abs(x), Math.abs(y));
    p.setZ(i, d > YARI + 4 ? (Math.sin(x * 0.3) * Math.cos(y * 0.27) * 0.7 + Math.random() * 0.3) * Math.min(1, (d - YARI - 4) / 8) : 0);
  }
  g.computeVertexNormals();
  const zemin = new THREE.Mesh(g, mat("#e9f1f8", { roughness: 1 }));
  zemin.rotation.x = -Math.PI / 2; zemin.receiveShadow = true; scene.add(zemin);
  // İnşa alanı: hafif farklı tonda kar ve taş kenarlık
  const alan = new THREE.Mesh(new THREE.PlaneGeometry(YARI * 2, YARI * 2), mat("#dfe9f2", { roughness: 1 }));
  alan.rotation.x = -Math.PI / 2; alan.position.y = 0.01; alan.receiveShadow = true; scene.add(alan);
  for (const [x, z, w, d] of [[0, -YARI - 0.3, YARI * 2 + 1.2, 0.6], [0, YARI + 0.3, YARI * 2 + 1.2, 0.6], [-YARI - 0.3, 0, 0.6, YARI * 2], [YARI + 0.3, 0, 0.6, YARI * 2]])
    kutu(w, 0.25, d, R.acikTas, x, 0.12, z, scene);
  const buz = mat("#9fd6ea", { roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.9 });
  [[-33, 12, 3], [34, -14, 2.6], [10, 34, 2.4]].forEach(([x, z, r]) => {
    const gl = new THREE.Mesh(new THREE.CircleGeometry(r, 20), buz);
    gl.rotation.x = -Math.PI / 2; gl.scale.set(1.5, 1, 1); gl.position.set(x, 0.05, z); scene.add(gl);
  });
})();

(function orman() {
  const noktalar = [];
  for (let i = 0; i < 2500 && noktalar.length < 300; i++) {
    const x = (Math.random() - 0.5) * 130, z = (Math.random() - 0.5) * 130;
    if (Math.max(Math.abs(x), Math.abs(z)) < YARI + 4 || noktalar.some(([a, b]) => Math.hypot(a - x, b - z) < 2)) continue;
    noktalar.push([x, z, 0.9 + Math.random() * 0.8]);
  }
  const govde = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.22, 1, 6), R.koyuTahta, noktalar.length);
  const katlar = [[1.6, 1.8, 1.4], [1.25, 1.6, 2.4], [0.85, 1.4, 3.3]];
  const yaprak = katlar.map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), mat("#2f5a4a"), noktalar.length));
  const karlar = katlar.map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), R.kar, noktalar.length));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
  noktalar.forEach(([x, z, k], i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6);
    govde.setMatrixAt(i, m.compose(v.set(x, 0.5 * k, z), q, s.set(k, k, k)));
    katlar.forEach(([r, h, y], j) => {
      yaprak[j].setMatrixAt(i, m.compose(v.set(x, y * k, z), q, s.set(r * k, h * k, r * k)));
      karlar[j].setMatrixAt(i, m.compose(v.set(x, (y + h * 0.28) * k, z), q, s.set(r * k * 0.72, h * k * 0.5, r * k * 0.72)));
    });
  });
  [govde, ...yaprak, ...karlar].forEach((im) => { im.castShadow = true; im.receiveShadow = true; scene.add(im); });
  const n = 80;
  const kayaM = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), R.acikTas, n);
  const kayaK = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), R.kar, n);
  for (let i = 0; i < n; i++) {
    let x, z;
    do { x = (Math.random() - 0.5) * 110; z = (Math.random() - 0.5) * 110; } while (Math.max(Math.abs(x), Math.abs(z)) < YARI + 3);
    const k = 0.4 + Math.random() * 1.2;
    q.setFromEuler(new THREE.Euler(Math.random(), Math.random() * 6, Math.random()));
    kayaM.setMatrixAt(i, m.compose(v.set(x, k * 0.4, z), q, s.set(k, k * 0.8, k)));
    kayaK.setMatrixAt(i, m.compose(v.set(x, k * 0.75, z), q, s.set(k * 0.8, k * 0.35, k * 0.8)));
  }
  [kayaM, kayaK].forEach((im) => { im.castShadow = true; im.receiveShadow = true; scene.add(im); });
})();

function koyBinasiModel(sv) {
  const d = new THREE.Group(), g = new THREE.Group(); d.add(g); g.scale.setScalar(0.92);
  karliKutu(8.5, 0.7, 7.5, R.tas, 0, 0, 0, g);
  for (let i = 0; i < 3; i++) kutu(3, 0.23, 0.6, R.acikTas, 0, 0.12 + i * 0.23, 4.05 - i * 0.35, g);
  let y = 0.7, gen = 5.6, der = 4.8;
  for (let k = 0; k < 1 + sv; k++) {
    const h = k === 0 ? 2.4 : 1.3;
    karliKutu(gen, h, der, k % 2 ? R.koyuTas : R.tas, 0, y, 0, g);
    kutu(gen + 0.06, 0.14, der + 0.06, R.altin, 0, y + h - 0.25, 0, g);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) karliKutu(0.75, h + 0.5, 0.75, R.koyuTas, sx * gen / 2, y, sz * der / 2, g);
    if (k > 0) for (let p = -1; p <= 1; p += 2) kutu(0.35, 0.55, 0.05, R.pencere, p * gen * 0.22, y + h / 2, der / 2 + 0.03, g);
    y += h; gen *= 0.8; der *= 0.8;
  }
  kutu(1.5, 1.8, 0.1, R.pencere, 0, 1.6, 2.42, g);
  kutu(1.8, 0.2, 0.2, R.altin, 0, 2.6, 2.45, g);
  const kalkan = new THREE.Group();
  silindir(0.75, 0.75, 0.12, 5, R.siyah, 0, 0, 0, kalkan).rotation.x = Math.PI / 2;
  silindir(0.55, 0.55, 0.14, 3, R.altin, 0, 0, 0.02, kalkan).rotation.x = Math.PI / 2;
  kalkan.position.set(0, 3.6, 2.5); g.add(kalkan);
  const amblem = new THREE.Group();
  silindir(1.2, 1.2, 0.3, 24, R.altinParlak, 0, 0, 0, amblem).rotation.x = Math.PI / 2;
  parca(geo("torus1", () => new THREE.TorusGeometry(1.2, 0.14, 8, 28)), R.altin, 0, 0, 0, amblem);
  silindir(0.62, 0.62, 0.36, 3, R.siyah, 0, -0.08, 0, amblem).rotation.x = Math.PI / 2;
  amblem.position.set(0, y + 1.6, 0); g.add(amblem);
  silindir(0.18, 0.25, 0.7, 6, R.altin, 0, y + 0.35, 0, g);
  d.userData.don = amblem;
  bayrak(-4.6, 0.7, -3.2, g, 3 + sv * 0.4); bayrak(4.3, 0.7, -3.2, g, 3 + sv * 0.4);
  mesale(-1.6, 0.7, 3.4, g, true); mesale(1.6, 0.7, 3.4, g);
  d.userData.yukseklik = (y + 3) * 0.92;
  return d;
}

function ciftlikModel(sv) {
  const g = new THREE.Group();
  // Çit
  for (let k = -2.6; k <= 2.61; k += 0.65) for (const [x, z] of [[k, -2.6], [k, 2.6], [-2.6, k], [2.6, k]]) kutu(0.12, 0.7, 0.12, R.acikTahta, x, 0.35, z, g);
  for (const [x, z, w, d] of [[0, -2.6, 5.2, 0.06], [0, 2.6, 5.2, 0.06], [-2.6, 0, 0.06, 5.2], [2.6, 0, 0.06, 5.2]]) kutu(w, 0.08, d, R.acikTahta, x, 0.5, z, g);
  // Tarla sıraları
  const toprak = mat("#6b5640", { roughness: 1 });
  const sira = Math.min(2 + sv, 6);
  for (let r = 0; r < sira; r++) {
    const z = -2 + r * 0.7;
    kutu(3, 0.15, 0.45, toprak, 0.6, 0.08, z, g);
    for (let k = 0; k < 6; k++) koni(0.14, 0.55, 5, R.bugday, -0.6 + k * 0.48, 0.42, z, g);
  }
  // Ambar
  karliKutu(1.7, 1.4, 1.6, R.kirmizi, -1.6, 0, 1.6, g);
  cati(1.9, 1.8, 0.9, R.koyuTahta, -1.6, 1.56, 1.6, g);
  kutu(0.6, 0.9, 0.05, R.beyaz, -1.6, 0.45, 2.42, g);
  // Yel değirmeni pervanesi (seviye 3 ve üstü)
  if (sv >= 3) {
    silindir(0.25, 0.35, 3, 6, R.beyaz, 2, 1.5, 2, g);
    const p = new THREE.Group(); p.position.set(2, 2.9, 2.38); g.add(p);
    for (let i = 0; i < 4; i++) {
      const kanat = kutu(0.25, 1.8, 0.04, R.acikTahta, Math.sin(i * Math.PI / 2) * 0.9, Math.cos(i * Math.PI / 2) * 0.9, 0, p);
      kanat.rotation.z = -i * Math.PI / 2;
    }
    g.userData.cark = p;
  }
  g.userData.yukseklik = sv >= 3 ? 4.2 : 2.8;
  return g;
}

function depoModel(sv) {

function insaatciModel() {

// Duvar seviyeleri: malzeme ve yükseklik
const DUVAR_GORUNUM = [
  { m: R.acikTahta, h: 1.1, sivri: true }, { m: R.tahta, h: 1.3, sivri: true, bant: R.demir },
  { m: R.tas, h: 1.4 }, { m: R.koyuTas, h: 1.6, bant: R.altin }, { m: R.demir, h: 1.8, bant: R.altin },
];
function duvarKomsulari(b) {
  const var_ = (i, j) => durum.binalar.some((x) => TURLER[x.tur].duvar && x.i === i && x.j === j);
  return { xp: var_(b.i + 1, b.j), zp: var_(b.i, b.j + 1), xn: var_(b.i - 1, b.j), zn: var_(b.i, b.j - 1) };
}
function duvarModel(sv, b, kapi = false) {
  const g = new THREE.Group(), gr = DUVAR_GORUNUM[sv - 1], n = b ? duvarKomsulari(b) : {};
  const baglanti = (dx, dz) => { // komşuya doğru yarım kare uzunluğunda duvar
    const w = dx ? KARE / 2 : 0.7, d = dz ? KARE / 2 : 0.7;
    karliKutu(w, gr.h * 0.85, d, gr.m, dx * KARE / 4, 0, dz * KARE / 4, g);
    if (gr.bant) kutu(w + 0.04, 0.1, d + 0.04, gr.bant, dx * KARE / 4, gr.h * 0.6, dz * KARE / 4, g);
    if (gr.sivri) for (let k = 0; k < 2; k++) koni(0.18, 0.4, 5, gr.m, dx * (0.3 + k * 0.45), gr.h * 0.85 + 0.2, dz * (0.3 + k * 0.45), g);
  };
  if (kapi) {
    const xYonunde = n.xp || n.xn || !(n.zp || n.zn);
    const kg = new THREE.Group(); g.add(kg); if (!xYonunde) kg.rotation.y = Math.PI / 2;
    for (const s of [-1, 1]) { karliKutu(0.5, gr.h + 0.5, 0.8, gr.m, s * 0.75, 0, 0, kg); }
    kutu(1.05, gr.h * 0.9, 0.18, R.koyuTahta, 0, gr.h * 0.45, 0, kg);
    kutu(1.1, 0.12, 0.22, gr.bant || R.demir, 0, gr.h * 0.7, 0, kg);
    kutu(1.1, 0.12, 0.22, gr.bant || R.demir, 0, gr.h * 0.25, 0, kg);
    karliKutu(2, 0.3, 0.8, gr.m, 0, gr.h + 0.5, 0, kg);
  } else {
    karliKutu(0.85, gr.h, 0.85, gr.m, 0, 0, 0, g);
    if (gr.sivri) koni(0.3, 0.5, 5, gr.m, 0, gr.h + 0.3, 0, g);
    if (gr.bant) kutu(0.9, 0.1, 0.9, gr.bant, 0, gr.h * 0.6, 0, g);
  }
  if (n.xp) baglanti(1, 0); if (n.xn) baglanti(-1, 0); if (n.zp) baglanti(0, 1); if (n.zn) baglanti(0, -1);
  g.userData.yukseklik = gr.h + 1;
  return g;
}

// İnşaat iskelesi
function iskele(boyut, temel) {
  const g = new THREE.Group(), w = boyut * KARE - 0.6, h = Math.max(2, boyut * 0.9);
  if (temel) karliKutu(w, 0.3, w, R.acikTas, 0, 0, 0, g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) kutu(0.14, h, 0.14, R.acikTahta, sx * w / 2, h / 2, sz * w / 2, g);
  for (const y of [h * 0.35, h * 0.7, h]) {
    kutu(w, 0.1, 0.1, R.acikTahta, 0, y, w / 2, g); kutu(w, 0.1, 0.1, R.acikTahta, 0, y, -w / 2, g);
    kutu(0.1, 0.1, w, R.acikTahta, w / 2, y, 0, g); kutu(0.1, 0.1, w, R.acikTahta, -w / 2, y, 0, g);
  }
  if (temel) { kutu(0.8, 0.5, 0.8, R.kesmeTas, w * 0.25, 0.55, w * 0.2, g); silindir(0.2, 0.2, 1.2, 6, R.acikTahta, -w * 0.2, 0.5, -w * 0.15, g).rotation.z = Math.PI / 2; }
  return g;
}

const MODEL = {
  koyBinasi: koyBinasiModel, altinMadeni: altinMadeniModel, kerestekampi: kerestekampiModel, tasOcagi: tasOcagiModel,
  ciftlik: ciftlikModel, depo: depoModel, insaatci: insaatciModel,

// Kare koordinatından dünya koordinatına
const merkez = (i, j, boyut) => [(i + boyut / 2) * KARE - YARI, (j + boyut / 2) * KARE - YARI];

const nesneler = new Map(); // bina id -> Group
function ustunde(n, ata) { for (; n; n = n.parent) if (n === ata) return true; return false; }
function binaCiz(b, animasyon = false) {
  const eski = nesneler.get(b.id);
  if (eski) {
    scene.remove(eski);
    const kalan = alevler.filter((a) => !ustunde(a.mesh, eski)); alevler.length = 0; alevler.push(...kalan);
  }
  const t = TURLER[b.tur];
  const kok = new THREE.Group();
  if (b.sv > 0) kok.add(MODEL[b.tur](b.sv, b));
  if (b.bitis) kok.add(iskele(t.boyut, b.sv === 0));
  const icerik = kok.children[0];
  kok.userData = { bina: b.id, yukseklik: icerik?.userData.yukseklik || 2.5, don: icerik?.userData.don, cark: icerik?.userData.cark };
  if (!t.duvar) kok.rotation.y = (b.rot || 0) * Math.PI / 2;
  const [x, z] = merkez(b.i, b.j, t.boyut);
  kok.position.set(x, 0, z);
  if (animasyon) { kok.scale.setScalar(0.01); kok.userData.buyume = 0; parlama(x, z); }
  scene.add(kok);
  nesneler.set(b.id, kok);
}
function binaSil(b) {
  const n = nesneler.get(b.id);
  if (n) { scene.remove(n); const kalan = alevler.filter((a) => !ustunde(a.mesh, n)); alevler.length = 0; alevler.push(...kalan); }
  nesneler.delete(b.id);
}

// =====================================================================
// YERLEŞİM: çakışma kontrolü
// =====================================================================
function doluMu(i, j, boyut, haric) {
  if (i < 0 || j < 0 || i + boyut > IZGARA || j + boyut > IZGARA) return true;
  return durum.binalar.some((b) => {
    if (b === haric) return false;
    const s = TURLER[b.tur].boyut;
    return i < b.i + s && b.i < i + boyut && j < b.j + s && b.j < j + boyut;
  });
}
function bosYerBul(boyut) {
  const orta = IZGARA / 2;
  let en = null, enD = 1e9;
  for (let i = 0; i <= IZGARA - boyut; i++) for (let j = 0; j <= IZGARA - boyut; j++) {
    if (doluMu(i, j, boyut)) continue;
    const d = Math.hypot(i + boyut / 2 - orta, j + boyut / 2 - orta);
    if (d < enD) { enD = d; en = [i, j]; }
  }
  return en;
}

}
function ekranKonumu(x, y, z) {

  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, gorunur: v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2 };
}

// ---- Seçili bina paneli ----
let secili = null;
function sec(b) {
  secili = b;
  const t = TURLER[b.tur], [x, z] = merkez(b.i, b.j, t.boyut);
  secimHalkasi.position.set(x, 0.05, z); secimHalkasi.scale.setScalar(t.boyut * KARE * 1.42); secimHalkasi.visible = true;
  panelCiz(); panelAc("panel");
}
function secimiKaldir() { secili = null; secimHalkasi.visible = false; }
function panelCiz() {
  const b = secili; if (!b) return;
  const t = TURLER[b.tur], s = b.sv > 0 ? seviye(b) : null, svSonra = t.seviyeler[b.sv];
  const ad = t.seviyeAdlari ? t.seviyeAdlari[b.sv - 1] : t.ad;
  $("pBaslik").textContent = `${t.ikon} ${ad} · Seviye ${b.sv || 0}`;
  let a = t.aciklama;
  if (s && t.uretir) a += ` Saatte ${s.uretim} ${KAYNAKLAR[t.uretir].ikon}, en fazla ${s.depo} birikir.`;
  if (b.tur === "koyBinasi") a += ` Kaynak deposu: her biri ${kapasite().toLocaleString("tr-TR")}.`;
  if (s && b.tur === "depo") a += ` Her kaynağa +${s.ekKapasite.toLocaleString("tr-TR")} kapasite.`;
  if (b.bitis) a = `⏳ ${b.sv === 0 ? "İnşa ediliyor" : "Seviye " + b.hedef + "'ye yükseltiliyor"}. Kalan: ${sureYazi((b.bitis - simdi()) / 1000)}.`;
  $("pAciklama").textContent = a;
  const d = $("pDugmeler"); d.innerHTML = "";
  const dugme = (html, sinif, fn, kapali = false) => {
    const e = document.createElement("button"); e.className = "dugme " + sinif; e.innerHTML = html; e.disabled = kapali; e.onclick = fn; d.appendChild(e); return e;
  };
  if (!b.bitis) {
    if (svSonra) {
      const engel = b.tur !== "koyBinasi" && b.sv >= kbSv() ? `Belediye Sv ${b.sv + 1} gerekli` : "";
      dugme(`⬆️ Yükselt<div class="maliyet">${engel || maliyetHtml(svSonra.maliyet)}${svSonra.sure ? " · ⏱ " + sureYazi(svSonra.sure) : ""}</div>`,
        "", () => yukselt(b), !!engel);
    } else dugme("En yüksek seviye 🏆", "", null, true);
    if (t.uretir) dugme(`${KAYNAKLAR[t.uretir].ikon} Topla<div class="maliyet">${bekleyen(b)}</div>`, "sari", (o) => topla(b, o));
    if (t.duvar) {
      const ayni = durum.binalar.filter((x) => x.tur === b.tur && x.sv === b.sv && !x.bitis);
      if (svSonra && ayni.length > 1 && b.sv < kbSv()) {
        const toplam = {}; for (const [k, v] of Object.entries(svSonra.maliyet)) toplam[k] = v * ayni.length;
        dugme(`⬆️ Hepsini (${ayni.length})<div class="maliyet">${maliyetHtml(toplam)}</div>`, "mavi", () => topluYukselt(ayni, toplam));
      }
      dugme("🗑️ Kaldır", "kirmizi", () => kaldir(b));
    }
  }
  if (!t.duvar) dugme("✋ Taşı", "mavi", () => yerlestirmeBaslat({ tasinan: b }));
}
function mesaj(m, el = "pMesaj") { $(el).textContent = m; if (m) setTimeout(() => { if ($(el).textContent === m) $(el).textContent = ""; }, 3500); }

// ---- Oyun işlemleri ----
function topla(b, olay) {
  const k = TURLER[b.tur].uretir, miktar = Math.min(bekleyen(b), kapasite() - Math.floor(durum.kaynak[k]));
  if (miktar <= 0) { mesaj(durum.kaynak[k] >= kapasite() ? `${KAYNAKLAR[k].ad} deposu dolu! Depo yap veya yükselt.` : "Henüz toplanacak bir şey yok."); return false; }
  durum.kaynak[k] += miktar; b.toplama = simdi(); kaydet();
  tg?.HapticFeedback?.impactOccurred("light");
  if (olay) ucanYazi(olay.clientX, olay.clientY, `+${miktar} ${KAYNAKLAR[k].ikon}`);
  ustCubuk(); panelCiz();
  return true;
}
function insaatBaslat(b, hedef, sure) {
  if (sure > 0) { b.bitis = simdi() + sure * 1000; b.hedef = hedef; }
  else { b.sv = hedef; }
}
function yukselt(b) {
  const t = TURLER[b.tur], s = t.seviyeler[b.sv];
  if (!s) return;
  if (b.tur !== "koyBinasi" && b.sv >= kbSv()) return mesaj("Önce Belediye Binasını yükselt.");
  if (!yeterli(s.maliyet)) return mesaj("Yeterli kaynağın yok.");
  if (s.sure > 0 && mesgulInsaatci() >= insaatciSayisi()) return mesaj("Bütün inşaatçılar meşgul. İnşaatçı Kulübesi yapabilirsin.");
  if (t.uretir) { topla(b); b.toplama = simdi(); }
  harca(s.maliyet); insaatBaslat(b, b.sv + 1, s.sure);
  kaydet(); tg?.HapticFeedback?.notificationOccurred("success");
  if (t.duvar) duvarlariYenile(b.i, b.j); else binaCiz(b, !b.bitis);
  ustCubuk(); panelCiz();
}
function topluYukselt(liste, toplam) {
  if (!yeterli(toplam)) return mesaj("Yeterli kaynağın yok.");
  harca(toplam); liste.forEach((b) => b.sv++);
  kaydet(); liste.forEach((b) => binaCiz(b)); ustCubuk(); panelCiz();
}
function kaldir(b) {
  durum.binalar.splice(durum.binalar.indexOf(b), 1); binaSil(b);
  duvarlariYenile(b.i, b.j); kaydet(); secimiKaldir(); panelAc(null); ustCubuk();
}
function insaatlariKontrolEt() {
  let degisti = false;
  for (const b of durum.binalar) if (b.bitis && b.bitis <= simdi()) {
    b.sv = b.hedef; b.bitis = 0; b.hedef = 0; b.toplama = simdi(); degisti = true;
    binaCiz(b, true); tg?.HapticFeedback?.notificationOccurred("success");
  }
  if (degisti) { kaydet(); ustCubuk(); if (secili) panelCiz(); }
}

// ---- Yerleştirme modu (yeni bina veya taşıma) ----
let yer = null; // { tur, tasinan, i, j, rot, hayalet }
const ayakIzi = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x5fd068, transparent: true, opacity: 0.45, depthWrite: false }));
ayakIzi.rotation.x = -Math.PI / 2; ayakIzi.visible = false; scene.add(ayakIzi);
const ayakCerceve = new THREE.Mesh(new THREE.RingGeometry(0.43, 0.5, 4, 1), new THREE.MeshBasicMaterial({ color: 0x5fd068, side: THREE.DoubleSide }));
ayakCerceve.rotation.z = Math.PI / 4; ayakCerceve.position.z = 0.01; ayakIzi.add(ayakCerceve);
function yerlestirmeBaslat({ tur, tasinan }) {
  secimiKaldir();
  tur = tur || tasinan.tur;
  const t = TURLER[tur];
  const bas = tasinan ? [tasinan.i, tasinan.j] : bosYerBul(t.boyut);
  if (!bas) { mesaj("Haritada boş yer kalmadı.", "pMesaj"); return; }
  const hayalet = new THREE.Group();
  hayalet.add(MODEL[tur](tasinan ? Math.max(1, tasinan.sv) : 1, null));
  scene.add(hayalet);
  if (tasinan) { const n = nesneler.get(tasinan.id); if (n) n.visible = false; }
  yer = { tur, tasinan, i: bas[0], j: bas[1], rot: tasinan?.rot || 0, hayalet };
  izgaraCizgi.visible = true; ayakIzi.visible = true;
  yerGuncelle(); panelAc("yerlestirme");
}
function yerGecerli() { return !doluMu(yer.i, yer.j, TURLER[yer.tur].boyut, yer.tasinan); }
function yerGuncelle() {
  const t = TURLER[yer.tur], [x, z] = merkez(yer.i, yer.j, t.boyut), gecerli = yerGecerli();
  yer.hayalet.position.set(x, 0.15, z); yer.hayalet.rotation.y = yer.rot * Math.PI / 2;
  ayakIzi.position.set(x, 0.06, z); ayakIzi.scale.set(t.boyut * KARE, t.boyut * KARE, 1);
  ayakCerceve.scale.setScalar(Math.SQRT2);
  ayakIzi.material.color.set(gecerli ? 0x5fd068 : 0xe46a5e); ayakCerceve.material.color.set(gecerli ? 0x5fd068 : 0xe46a5e);
  const m = yer.tasinan ? {} : yeniMaliyet(yer.tur);
  $("yBaslik").textContent = `${t.ikon} ${t.ad}`;
  $("yAciklama").innerHTML = yer.tasinan ? "Yeni yere dokun veya binayı sürükle." :
    `Yerleştirmek istediğin yere dokun veya binayı sürükle. <span class="maliyet">${maliyetHtml(m)}</span>`;
  const d = $("yDugmeler"); d.innerHTML = "";
  const ekle = (html, sinif, fn, kapali) => { const e = document.createElement("button"); e.className = "dugme " + sinif; e.innerHTML = html; e.disabled = !!kapali; e.onclick = fn; d.appendChild(e); };
  ekle("✕ İptal", "kirmizi", yerlestirmeBitir);
  ekle("↻ Döndür", "mavi", () => { yer.rot = (yer.rot + 1) % 4; yerGuncelle(); });
  ekle("✓ Yerleştir", "", yerlestirOnayla, !gecerli || (!yer.tasinan && !yeterli(m)));
}
function yerlestirOnayla() {
  if (!yer || !yerGecerli()) return;
  const t = TURLER[yer.tur];
  if (yer.tasinan) {
    Object.assign(yer.tasinan, { i: yer.i, j: yer.j, rot: yer.rot });
    binaCiz(yer.tasinan);
  } else {
    const m = yeniMaliyet(yer.tur), sure = t.seviyeler[0].sure;
    if (!yeterli(m)) return mesaj("Yeterli kaynağın yok.", "yMesaj");
    if (sure > 0 && mesgulInsaatci() >= insaatciSayisi()) return mesaj("Bütün inşaatçılar meşgul.", "yMesaj");
    harca(m);
    const b = { id: sonrakiId++, tur: yer.tur, sv: 0, i: yer.i, j: yer.j, rot: yer.rot, toplama: simdi() };
    insaatBaslat(b, 1, sure);
    durum.binalar.push(b); binaCiz(b, true);
  }
  kaydet(); tg?.HapticFeedback?.notificationOccurred("success");
  yerlestirmeBitir(); ustCubuk();
}
function yerlestirmeBitir() {
  if (!yer) return;
  scene.remove(yer.hayalet);
  if (yer.tasinan) { const n = nesneler.get(yer.tasinan.id); if (n) n.visible = true; }
  yer = null; izgaraCizgi.visible = false; ayakIzi.visible = false; controls.enabled = true;
  panelAc(null);
}

// ---- Duvar çizme modu ----
let duvarModu = null; // { tur, bas: [i,j], onizleme: Group }
function duvarModuBaslat(tur) {
  secimiKaldir();
  duvarModu = { tur, bas: null, onizleme: new THREE.Group() };
  scene.add(duvarModu.onizleme);
  izgaraCizgi.visible = true; controls.enabled = false;
  duvarPanel(); panelAc("yerlestirme");
}
function duvarPanel(not = "") {
  const t = TURLER[duvarModu.tur];
  $("yBaslik").textContent = `${t.ikon} ${t.ad} çiz`;
  $("yAciklama").innerHTML = `${t.duvar && duvarModu.tur === "duvar" ? "Parmağınla sürükleyerek düz bir çizgi çiz." : "Kapıyı koymak istediğin kareye dokun."}
    <span class="maliyet">Tanesi ${maliyetHtml(t.seviyeler[0].maliyet)} · ${adet(duvarModu.tur)}/${limit(duvarModu.tur)}</span>`;
  const d = $("yDugmeler"); d.innerHTML = "";
  const e = document.createElement("button"); e.className = "dugme"; e.textContent = "✓ Bitti"; e.onclick = duvarModuBitir; d.appendChild(e);
  $("yMesaj").textContent = not;
}
function duvarHatti(bas, son) { // baştan sona yatay veya dikey kareler
  const [i0, j0] = bas, [i1, j1] = son, kareler = [];
  if (Math.abs(i1 - i0) >= Math.abs(j1 - j0)) for (let i = Math.min(i0, i1); i <= Math.max(i0, i1); i++) kareler.push([i, j0]);
  else for (let j = Math.min(j0, j1); j <= Math.max(j0, j1); j++) kareler.push([i0, j]);
  return duvarModu.tur === "kapi" ? kareler.slice(0, 1) : kareler;
}
function duvarOnizle(son) {
  const g = duvarModu.onizleme; g.clear();
  const kalanHak = limit(duvarModu.tur) - adet(duvarModu.tur);
  duvarHatti(duvarModu.bas, son).forEach(([i, j], n) => {
    const uygun = !doluMu(i, j, 1) && n < kalanHak;
    const k = new THREE.Mesh(geo("onz", () => new THREE.BoxGeometry(KARE * 0.9, 0.6, KARE * 0.9)),
      new THREE.MeshBasicMaterial({ color: uygun ? 0x5fd068 : 0xe46a5e, transparent: true, opacity: 0.55 }));
    const [x, z] = merkez(i, j, 1); k.position.set(x, 0.3, z); g.add(k);
  });
}
function duvarYerlestir(son) {
  const t = TURLER[duvarModu.tur], m = t.seviyeler[0].maliyet;
  let konan = 0, not = "";
  for (const [i, j] of duvarHatti(duvarModu.bas, son)) {
    if (doluMu(i, j, 1)) continue;
    if (adet(duvarModu.tur) >= limit(duvarModu.tur)) { not = "Duvar sınırına ulaştın. Belediye Binasını yükseltince artar."; break; }
    if (!yeterli(m)) { not = "Kaynak bitti."; break; }
    harca(m);
    const b = { id: sonrakiId++, tur: duvarModu.tur, sv: 1, i, j, rot: 0 };
    durum.binalar.push(b); konan++;
  }
  if (konan) {
    for (const b of durum.binalar) if (TURLER[b.tur].duvar) binaCiz(b);
    kaydet(); tg?.HapticFeedback?.impactOccurred("medium"); ustCubuk();
  }
  duvarModu.onizleme.clear(); duvarModu.bas = null;
  duvarPanel(not);
}
function duvarModuBitir() {
  if (!duvarModu) return;
  scene.remove(duvarModu.onizleme); duvarModu = null;
  izgaraCizgi.visible = false; controls.enabled = true; panelAc(null);
}

// =====================================================================
// DOKUNMA VE TIKLAMA
// =====================================================================
const isin = new THREE.Raycaster(), fare = new THREE.Vector2(), zeminDuzlem = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function isinKur(o) { fare.set(o.clientX / innerWidth * 2 - 1, -(o.clientY / innerHeight) * 2 + 1); isin.setFromCamera(fare, camera); }
function kareBul(o, boyut = 1) {
  isinKur(o);
  const p = new THREE.Vector3();
  if (!isin.ray.intersectPlane(zeminDuzlem, p)) return null;
  return [Math.round((p.x + YARI) / KARE - boyut / 2), Math.round((p.z + YARI) / KARE - boyut / 2), p];
}
let basla = null, suruk = false, birincil = null;
renderer.domElement.addEventListener("pointerdown", (o) => {
  if (birincil !== null) return; // ikinci parmak: kamera hareketi
  birincil = o.pointerId; basla = { x: o.clientX, y: o.clientY };
  if (yer) {
    const k = kareBul(o), s = TURLER[yer.tur].boyut;
    if (k && k[0] >= yer.i - 1 && k[0] <= yer.i + s && k[1] >= yer.j - 1 && k[1] <= yer.j + s) { suruk = true; controls.enabled = false; }
  }
  if (duvarModu) { const k = kareBul(o); if (k) { duvarModu.bas = [k[0], k[1]]; duvarOnizle(duvarModu.bas); } }
});
renderer.domElement.addEventListener("pointermove", (o) => {
  if (o.pointerId !== birincil) return;
  if (yer && suruk) {
    const s = TURLER[yer.tur].boyut, k = kareBul(o, s);
    if (k) { const i = Math.max(0, Math.min(IZGARA - s, k[0])), j = Math.max(0, Math.min(IZGARA - s, k[1])); if (i !== yer.i || j !== yer.j) { yer.i = i; yer.j = j; yerGuncelle(); } }
  }
  if (duvarModu?.bas) { const k = kareBul(o); if (k) duvarOnizle([k[0], k[1]]); }
});
function birak(o) {
  if (o.pointerId !== birincil) return;
  birincil = null;
  const tik = basla && Math.hypot(o.clientX - basla.x, o.clientY - basla.y) < 8;
  if (yer) {
    if (suruk) { suruk = false; controls.enabled = true; return; }
    if (tik) {
      const s = TURLER[yer.tur].boyut, k = kareBul(o, s);
      if (k) { yer.i = Math.max(0, Math.min(IZGARA - s, k[0])); yer.j = Math.max(0, Math.min(IZGARA - s, k[1])); yerGuncelle(); }
    }
    return;
  }
  if (duvarModu) { if (duvarModu.bas) { const k = kareBul(o); duvarYerlestir(k ? [k[0], k[1]] : duvarModu.bas); } return; }
  if (!tik) return;
  isinKur(o);
  const vurulan = isin.intersectObjects([...nesneler.values()], true)[0];
  if (!vurulan) { secimiKaldir(); panelAc(null); return; }
  let n = vurulan.object; while (n && n.userData.bina === undefined) n = n.parent;
  const b = durum.binalar.find((x) => x.id === n.userData.bina);
  if (!b) return;
  if (TURLER[b.tur].uretir && bekleyen(b) > 0 && !b.bitis) topla(b, o);
  sec(b);
}
renderer.domElement.addEventListener("pointerup", birak);
renderer.domElement.addEventListener("pointercancel", (o) => { if (o.pointerId === birincil) { birincil = null; suruk = false; if (yer) controls.enabled = true; } });

// =====================================================================
// BİNA ÜSTÜ GÖSTERGELER (toplanacak kaynak, inşaat sayacı)
// =====================================================================
const gostergeler = new Map(); // id -> { balon, sayac }
function gostergeleriGuncelle() {
  const goruldu = new Set();
  for (const b of durum.binalar) {
    const t = TURLER[b.tur], n = nesneler.get(b.id);
    if (!n || t.duvar) continue;
    let g = gostergeler.get(b.id);
    const bek = bekleyen(b), esik = t.uretir && b.sv > 0 ? Math.max(10, seviye(b).depo * 0.05) : Infinity;
    const balonGoster = bek >= esik, sayacGoster = !!b.bitis;
    if (!balonGoster && !sayacGoster) { if (g) { g.el.remove(); gostergeler.delete(b.id); } continue; }
    if (!g) { g = { el: document.createElement("div") }; document.body.appendChild(g.el); gostergeler.set(b.id, g); }
    goruldu.add(b.id);
    const k = ekranKonumu(n.position.x, n.userData.yukseklik + 0.5, n.position.z);
    g.el.style.display = k.gorunur && n.visible ? "" : "none";
    g.el.style.left = k.x + "px"; g.el.style.top = k.y + "px";
    if (sayacGoster) {
      const top = (t.seviyeler[b.hedef - 1].sure || 1) * 1000, kalan = b.bitis - simdi();
      const html = `⏳ ${sureYazi(kalan / 1000)}<b><i style="width:${Math.min(100, (1 - kalan / top) * 100).toFixed(1)}%"></i></b>`;
      if (g.html !== html) { g.el.className = "sayac"; g.el.innerHTML = g.html = html; }
    } else {
      const html = `${KAYNAKLAR[t.uretir].ikon} ${bek}`;
      if (g.html !== html) { g.el.className = "balon"; g.el.textContent = g.html = html; }
    }
  }
  for (const [id, g] of gostergeler) if (!goruldu.has(id)) { g.el.remove(); gostergeler.delete(id); }
}

// =====================================================================
// DÖNGÜ
// =====================================================================
const saat = new THREE.Clock();
let sonSaniye = 0;
function dongu() {
  const dt = Math.min(saat.getDelta(), 0.05), t = saat.elapsedTime;
  controls.update();
  controls.target.x = Math.max(-YARI, Math.min(YARI, controls.target.x)); controls.target.z = Math.max(-YARI, Math.min(YARI, controls.target.z)); controls.target.y = 0;
  for (const n of nesneler.values()) {
    if (n.userData.don) n.userData.don.rotation.y = t * 0.6;
    if (n.userData.cark) n.userData.cark.rotation.z = -t * 0.8;
    if (n.userData.buyume !== undefined && n.userData.buyume < 1) {
      const x = n.userData.buyume = Math.min(1, n.userData.buyume + dt * 2.2);
      n.scale.setScalar(Math.max(0.01, 1 + Math.sin(x * Math.PI) * 0.12 - (1 - x) * (1 - x) * 0.9));
    }
  }
  if (yer) yer.hayalet.position.y = 0.15 + Math.sin(t * 4) * 0.1;
  for (const a of alevler) {
    const f = 0.85 + Math.sin(t * 13 + a.faz) * 0.1 + Math.random() * 0.08;
    a.mesh.scale.set(f, 0.9 + Math.random() * 0.25, f);
    if (a.isik) a.isik.intensity = 1.2 * (0.85 + Math.random() * 0.25);
  }
  const p = karGeo.attributes.position.array;
  for (let i = 0; i < karN; i++) {
    p[i * 3 + 1] -= dt * (1.2 + (i % 5) * 0.25); p[i * 3] += Math.sin(t + i) * dt * 0.3;
    if (p[i * 3 + 1] < 0) p[i * 3 + 1] = 40;
  }
  karGeo.attributes.position.needsUpdate = true;
  for (let i = kivilcimlar.length - 1; i >= 0; i--) {
    const k = kivilcimlar[i]; k.t += dt; k.v.y -= 18 * dt;
    k.p.position.addScaledVector(k.v, dt); k.p.rotation.x += dt * 8;
    if (k.t > 1.4) { scene.remove(k.p); kivilcimlar.splice(i, 1); }
  }
  if (secimHalkasi.visible) secimHalkasi.material.opacity = 0.55 + Math.sin(t * 5) * 0.35;
  if (t - sonSaniye > 1) { sonSaniye = t; insaatlariKontrolEt(); ustCubuk(); if (secili && $("panel").classList.contains("acik")) panelCiz(); }
  gostergeleriGuncelle();
  renderer.render(scene, camera);
  requestAnimationFrame(dongu);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

yukle(() => {
  durum.binalar.forEach((b) => binaCiz(b));
  insaatlariKontrolEt(); ustCubuk(); dongu();
  const y = $("yukleniyor"); y.style.opacity = 0; setTimeout(() => y.remove(), 500);
  setTimeout(() => { $("ipucu").style.opacity = 0; }, 7000);
});
</script>
