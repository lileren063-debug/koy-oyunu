<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9dceb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #sahne { position: fixed; inset: 0; touch-action: none; }
  #sahne canvas { display: block; }

  .ust {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; pointer-events: none;
  }
  .hap {
    pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px;
    background: linear-gradient(#2a3140, #1a1f29); border: 2px solid #d4a017; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  .hap .simge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 17px;
    background: radial-gradient(circle at 35% 30%, #ffe27a, #d4a017 60%, #8a6408); box-shadow: inset 0 -2px 3px rgba(0,0,0,.3); }
  .hap .sayi { font-weight: 800; font-size: 17px; line-height: 1; }
  .hap .bar { width: 70px; height: 5px; border-radius: 3px; background: #0d1117; margin-top: 4px; overflow: hidden; }
  .hap .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f6c945, #ffdf70); width: 0; transition: width .4s; }
  .hap small { opacity: .6; font-size: 11px; }
  .rozet { font-weight: 800; font-size: 13px; padding: 7px 12px; }

  .etiket {
    position: fixed; z-index: 3; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
    background: rgba(17, 21, 29, .78); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
    border: 1px solid rgba(212,160,23,.6); text-shadow: 0 1px 2px #000;
  }
  .balon {
    position: fixed; z-index: 4; transform: translate(-50%, -100%); pointer-events: none;
    background: #fff; color: #3d2b1f; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); animation: zipla 1s ease-in-out infinite;
  }
  @keyframes zipla { 50% { margin-top: -5px; } }
  .ucan { position: fixed; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px;
    color: #ffd84a; text-shadow: 0 2px 0 #7a5200, 0 0 8px rgba(0,0,0,.5); animation: uc 1.1s ease-out forwards; }
  @keyframes uc { to { margin-top: -70px; opacity: 0; } }

  #ipucu {
    position: fixed; z-index: 4; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none;
    background: rgba(17,21,29,.75); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 12px; white-space: nowrap; transition: opacity .4s;
  }
  #panel {
    position: fixed; z-index: 7; left: 50%; bottom: 12px; width: min(94vw, 440px); transform: translate(-50%, 130%);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2); padding: 14px 16px 16px; border-radius: 18px; color: #f3ead6;
    background: linear-gradient(#2a3140f2, #1a1f29f2); border: 2px solid #d4a017; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #panel.acik { transform: translate(-50%, 0); }
  #panel h2 { margin: 0 28px 6px 0; font-size: 18px; color: #ffd84a; font-family: Georgia, "Times New Roman", serif; letter-spacing: .3px; }
  #panel p { margin: 4px 0; font-size: 14px; line-height: 1.35; opacity: .92; }
  #kapat { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.1); color: #fff; font-size: 16px; cursor: pointer; }
  .dugmeler { display: flex; gap: 8px; margin-top: 12px; }
  .dugme {
    flex: 1; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
    background: linear-gradient(#5fd068, #36a144); color: #fff; box-shadow: 0 4px 0 #22702c; text-shadow: 0 1px 1px rgba(0,0,0,.35);
  }
  .dugme:active { transform: translateY(3px); box-shadow: 0 1px 0 #22702c; }
  .dugme:disabled { background: linear-gradient(#8b8f98, #6c707a); box-shadow: 0 4px 0 #4a4d55; }
  .dugme.altin { background: linear-gradient(#ffd84a, #e0a812); color: #3d2b1f; box-shadow: 0 4px 0 #9c7208; text-shadow: none; }
  #mesaj { min-height: 18px; margin-top: 8px; font-size: 13px; color: #ff8f8f; }
  #yukleniyor { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #1a1f29; color: #ffd84a;
    font: 800 20px Georgia, serif; transition: opacity .5s; }
</style>
</head>
<body>
<div id="sahne"></div>

<div class="ust">
  <div class="hap">
    <div class="simge">🪙</div>
    <div>
      <div class="sayi"><span id="altin">0</span> <small>/ <span id="kapasite">0</span></small></div>
      <div class="bar"><i id="altinBar"></i></div>
    </div>
  </div>
  <div class="hap rozet">🏰 Seviye <span id="kbSeviye">1</span></div>
</div>

<div id="ipucu">Binalara dokun · Sürükleyerek döndür · İki parmakla yakınlaş</div>

<div id="panel">
  <button id="kapat" aria-label="Kapat">✕</button>
  <h2 id="pBaslik"></h2>
  <p id="pAciklama"></p>
  <div class="dugmeler" id="pDugmeler"></div>
  <div id="mesaj"></div>
</div>

<div id="yukleniyor">Mini Empire</div>

<script>
// =====================================================================
// OYUN KURALLARI: dengeyi buradan ayarla
// =====================================================================
const BINALAR = {
  koyBinasi: {
    ad: "Köy Binası", konum: [0, -6],
    seviyeler: [
      { maliyet: 0, kapasite: 1000 },
      { maliyet: 800, kapasite: 3000 },
      { maliyet: 2500, kapasite: 8000 },
      { maliyet: 7000, kapasite: 20000 },
      { maliyet: 18000, kapasite: 50000 },
    ],
  },
  altinMadeni: {
    ad: "Altın Madeni", konum: [-9, 0],
    seviyeler: [
      { maliyet: 0, uretim: 200, depo: 500 },
      { maliyet: 300, uretim: 400, depo: 1000 },
      { maliyet: 1000, uretim: 700, depo: 2000 },
      { maliyet: 3000, uretim: 1200, depo: 4000 },
      { maliyet: 8000, uretim: 2000, depo: 8000 },
    ],
  },
};
const BASLANGIC = { altin: 500, koyBinasi: 1, altinMadeni: 1, sonToplama: Date.now() };

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.disableVerticalSwipes?.(); // köyü sürüklerken uygulama kapanmasın

let durum = { ...BASLANGIC };
let secili = null;

// ---- Kayıt: Telegram içinde Telegram bulut deposu, dışarıda tarayıcı deposu ----
function kaydet() {
  const veri = JSON.stringify(durum);
  if (tg?.CloudStorage && tg.initData) tg.CloudStorage.setItem("koy", veri);
  try { localStorage.setItem("koy", veri); } catch (e) {}
}
function yukle(bitti) {
  const uygula = (veri) => { if (veri) { try { durum = { ...BASLANGIC, ...JSON.parse(veri) }; } catch (e) {} } bitti(); };
  if (tg?.CloudStorage && tg.initData) tg.CloudStorage.getItem("koy", (hata, veri) => uygula(hata ? null : veri));
  else { let veri = null; try { veri = localStorage.getItem("koy"); } catch (e) {} uygula(veri); }
}

const bilgi = (id) => BINALAR[id].seviyeler[durum[id] - 1];
const sonraki = (id) => BINALAR[id].seviyeler[durum[id]];
const kapasite = () => bilgi("koyBinasi").kapasite;
function bekleyen() {
  const m = bilgi("altinMadeni");
  return Math.min(Math.floor((Date.now() - durum.sonToplama) / 3600000 * m.uretim), m.depo);
}

// =====================================================================
// 3D SAHNE
// =====================================================================
const kap = document.getElementById("sahne");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
kap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SIS = new THREE.Color("#c9dceb").convertSRGBToLinear();
scene.background = SIS;
scene.fog = new THREE.Fog(SIS, 45, 95);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(-2, 0, -1);
// Dikey telefon ekranında köyün tamamı görünsün diye kamerayı biraz uzaklaştır
const kameraUzaklik = innerWidth < innerHeight ? 64 : 44;
camera.position.copy(new THREE.Vector3(24, 26, 30).normalize().multiplyScalar(kameraUzaklik).add(controls.target));
scene.fog.near = kameraUzaklik + 5; scene.fog.far = kameraUzaklik + 60;
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 18;
controls.maxDistance = 75;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = 1.15;
controls.update();

// Işıklar
scene.add(new THREE.HemisphereLight(new THREE.Color("#dcecff"), new THREE.Color("#7d8da3"), 0.75));
const gunes = new THREE.DirectionalLight(new THREE.Color("#fff1dc"), 1.15);
gunes.position.set(-18, 30, 14);
gunes.castShadow = true;
gunes.shadow.mapSize.setScalar(innerWidth < 700 ? 1024 : 2048);
Object.assign(gunes.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 90 });
gunes.shadow.bias = -0.0006;
scene.add(gunes);

// ---- Yardımcılar ----
const malzemeler = {};
function mat(renk, ek = {}) {
  const anahtar = renk + JSON.stringify(ek);
  if (!malzemeler[anahtar]) {
    const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(renk).convertSRGBToLinear(), roughness: 0.85, flatShading: true, ...ek });
    if (ek.emissive) m.emissive = new THREE.Color(ek.emissive).convertSRGBToLinear();
    malzemeler[anahtar] = m;
  }
  return malzemeler[anahtar];
}
const R = {
  tas: mat("#3b404b"), koyuTas: mat("#2a2e36"), acikTas: mat("#6d7482"), kar: mat("#f4f8fc", { roughness: 1 }),
  tahta: mat("#6b4526"), koyuTahta: mat("#47301c"), altin: mat("#e2a91b", { metalness: 0.6, roughness: 0.35, emissive: "#5a3c00" }),
  altinParlak: mat("#ffcf3a", { metalness: 0.4, roughness: 0.3, emissive: "#a86a00" }), siyah: mat("#16181d"),
  alev: mat("#ffb347", { emissive: "#ff7a00", roughness: 1 }), pencere: mat("#ffc56b", { emissive: "#ff9a2e" }),
  kumas: mat("#c9b98f"), kirmizi: mat("#b33a2e"), beyaz: mat("#ece6d8"), deri: mat("#c99a77"),
};
function parca(geo, malzeme, x = 0, y = 0, z = 0, ebeveyn) {
  const m = new THREE.Mesh(geo, malzeme);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (ebeveyn) ebeveyn.add(m);
  return m;
}
const kutu = (w, h, d, malzeme, x, y, z, e) => parca(new THREE.BoxGeometry(w, h, d), malzeme, x, y, z, e);
const silindir = (rt, rb, h, s, malzeme, x, y, z, e) => parca(new THREE.CylinderGeometry(rt, rb, h, s), malzeme, x, y, z, e);
function karliKutu(w, h, d, malzeme, x, y, z, e) {
  kutu(w, h, d, malzeme, x, y + h / 2, z, e);
  kutu(w + 0.12, 0.18, d + 0.12, R.kar, x, y + h + 0.06, z, e);
}

// Titreyen alevler ve ışıklar
const alevler = [];
function mesale(x, y, z, e, isik = false) {
  silindir(0.07, 0.09, 0.9, 6, R.koyuTahta, x, y + 0.45, z, e);
  kutu(0.28, 0.18, 0.28, R.altin, x, y + 0.95, z, e);
  const a = parca(new THREE.ConeGeometry(0.17, 0.5, 6), R.alev, x, y + 1.25, z, e);
  a.castShadow = false;
  const kayit = { mesh: a, faz: Math.random() * 10 };
  if (isik) {
    const l = new THREE.PointLight(new THREE.Color("#ff9a3c"), 1.2, 9, 2);
    l.position.set(x, y + 1.6, z); e.add(l); kayit.isik = l;
  }
  alevler.push(kayit);
}
function bayrak(x, y, z, e, boy = 2.2) {
  silindir(0.05, 0.05, boy, 6, R.siyah, x, y + boy / 2, z, e);
  const b = kutu(0.9, 0.6, 0.04, R.siyah, x + 0.47, y + boy - 0.35, z, e);
  parca(new THREE.ConeGeometry(0.16, 0.26, 3), R.altin, x + 0.47, y + boy - 0.35, z + 0.04, e).rotation.x = Math.PI / 2;
  return b;
}

// =====================================================================
// ARAZİ
// =====================================================================
(function arazi() {
  const g = new THREE.PlaneGeometry(160, 160, 80, 80);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), d = Math.hypot(x, y);
    p.setZ(i, d > 16 ? (Math.sin(x * 0.35) * Math.cos(y * 0.3) * 0.5 + Math.random() * 0.25) * Math.min(1, (d - 16) / 8) : 0);
  }
  g.computeVertexNormals();
  const zemin = new THREE.Mesh(g, mat("#e9f1f8", { roughness: 1 }));
  zemin.rotation.x = -Math.PI / 2; zemin.receiveShadow = true; scene.add(zemin);

  // Toprak meydan ve yollar
  const toprak = mat("#8f7a62", { roughness: 1 });
  const meydan = new THREE.Mesh(new THREE.CircleGeometry(5.5, 24), toprak);
  meydan.rotation.x = -Math.PI / 2; meydan.position.set(0, 0.02, 0); meydan.receiveShadow = true; scene.add(meydan);
  [[0, -3, 3, 7], [-5, 0, 9, 2.4], [5.5, -1.5, 8, 2.4], [1, 5, 2.4, 6]].forEach(([x, z, w, d]) => {
    const yol = new THREE.Mesh(new THREE.PlaneGeometry(w, d), toprak);
    yol.rotation.x = -Math.PI / 2; yol.position.set(x, 0.015, z); yol.receiveShadow = true; scene.add(yol);
  });
  // Donmuş göletler
  const buz = mat("#9fd6ea", { roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.9 });
  [[1.5, 8.5, 2.6], [-12, 9, 2.2], [11, 12, 1.8]].forEach(([x, z, r]) => {
    const gl = new THREE.Mesh(new THREE.CircleGeometry(r, 20), buz);
    gl.rotation.x = -Math.PI / 2; gl.scale.set(1.4, 1, 1); gl.position.set(x, 0.03, z); gl.receiveShadow = true; scene.add(gl);
  });
})();

// Çam ağaçları ve kayalar (çok sayıda olduğu için InstancedMesh)
(function orman() {
  const noktalar = [];
  for (let i = 0; i < 900 && noktalar.length < 170; i++) {
    const x = (Math.random() - 0.5) * 70, z = (Math.random() - 0.5) * 70;
    const icerde = x > -15 && x < 13 && z > -13 && z < 15;
    if (icerde || noktalar.some(([a, b]) => Math.hypot(a - x, b - z) < 1.8)) continue;
    noktalar.push([x, z, 0.8 + Math.random() * 0.7]);
  }
  const govde = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.22, 1, 6), R.koyuTahta, noktalar.length);
  const katlar = [[1.6, 1.8, 1.4], [1.25, 1.6, 2.4], [0.85, 1.4, 3.3]];
  const yaprak = katlar.map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), mat("#2f5a4a"), noktalar.length));
  const karlar = katlar.map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), R.kar, noktalar.length));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
  noktalar.forEach(([x, z, k], i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6);
    govde.setMatrixAt(i, m.compose(v.set(x, 0.5 * k, z), q, s.set(k, k, k)));
    katlar.forEach(([r, h, y], j) => {
      yaprak[j].setMatrixAt(i, m.compose(v.set(x, y * k, z), q, s.set(r * k, h * k, r * k)));
      karlar[j].setMatrixAt(i, m.compose(v.set(x, (y + h * 0.28) * k, z), q, s.set(r * k * 0.72, h * k * 0.5, r * k * 0.72)));
    });
  });
  [govde, ...yaprak, ...karlar].forEach((im) => { im.castShadow = true; im.receiveShadow = true; scene.add(im); });

  const kayaN = 60;
  const kaya = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), R.acikTas, kayaN);
  const kayaKar = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), R.kar, kayaN);
  for (let i = 0; i < kayaN; i++) {
    const a = Math.random() * Math.PI * 2, d = 17 + Math.random() * 20, k = 0.4 + Math.random() * 1.1;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    q.setFromEuler(new THREE.Euler(Math.random(), Math.random() * 6, Math.random()));
    kaya.setMatrixAt(i, m.compose(v.set(x, k * 0.4, z), q, s.set(k, k * 0.8, k)));
    kayaKar.setMatrixAt(i, m.compose(v.set(x, k * 0.75, z), q, s.set(k * 0.8, k * 0.35, k * 0.8)));
  }
  [kaya, kayaKar].forEach((im) => { im.castShadow = true; im.receiveShadow = true; scene.add(im); });
})();

// =====================================================================
// BİNALAR (seviyeye göre büyür)
// =====================================================================
function koyBinasiYap(sv) {
  const g = new THREE.Group();
  // Taban ve merdiven
  karliKutu(8.5, 0.7, 7.5, R.tas, 0, 0, 0, g);
  for (let i = 0; i < 3; i++) kutu(3, 0.23, 0.6, R.acikTas, 0, 0.12 + i * 0.23, 4.05 - i * 0.35, g);
  // Katlar: her seviye bir kat daha
  let y = 0.7, gen = 5.6, der = 4.8;
  const katSayisi = 1 + sv;
  for (let k = 0; k < katSayisi; k++) {
    const h = k === 0 ? 2.4 : 1.3;
    karliKutu(gen, h, der, k % 2 ? R.koyuTas : R.tas, 0, y, 0, g);
    kutu(gen + 0.06, 0.14, der + 0.06, R.altin, 0, y + h - 0.25, 0, g); // altın şerit
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) =>
      karliKutu(0.75, h + 0.5, 0.75, R.koyuTas, sx * gen / 2, y, sz * der / 2, g)); // köşe kuleleri
    if (k > 0) for (let p = -1; p <= 1; p += 2) kutu(0.35, 0.55, 0.05, R.pencere, p * gen * 0.22, y + h / 2, der / 2 + 0.03, g);
    y += h; gen *= 0.8; der *= 0.8;
  }
  // Kapı ve kalkan
  kutu(1.5, 1.8, 0.1, R.pencere, 0, 1.6, 2.42, g);
  kutu(1.8, 0.2, 0.2, R.altin, 0, 2.6, 2.45, g);
  const kalkan = new THREE.Group();
  silindir(0.75, 0.75, 0.12, 5, R.siyah, 0, 0, 0, kalkan).rotation.x = Math.PI / 2;
  silindir(0.55, 0.55, 0.14, 3, R.altin, 0, 0, 0.02, kalkan).rotation.x = Math.PI / 2;
  kalkan.position.set(0, 3.6, 2.5); g.add(kalkan);
  // Tepedeki dönen altın amblem
  const amblem = new THREE.Group();
  silindir(1.2, 1.2, 0.3, 24, R.altinParlak, 0, 0, 0, amblem).rotation.x = Math.PI / 2;
  parca(new THREE.TorusGeometry(1.2, 0.14, 8, 28), R.altin, 0, 0, 0, amblem);
  silindir(0.62, 0.62, 0.36, 3, R.siyah, 0, -0.08, 0, amblem).rotation.x = Math.PI / 2;
  amblem.position.set(0, y + 1.6, 0); g.add(amblem);
  silindir(0.18, 0.25, 0.7, 6, R.altin, 0, y + 0.35, 0, g);
  g.userData.amblem = amblem;
  // Bayraklar ve meşaleler
  bayrak(-4.6, 0.7, -3.2, g, 3 + sv * 0.4); bayrak(4.3, 0.7, -3.2, g, 3 + sv * 0.4);
  mesale(-1.6, 0.7, 3.4, g, true); mesale(1.6, 0.7, 3.4, g);
  return g;
}

function altinMadeniYap(sv) {
  const g = new THREE.Group();
  // Kaya tepesi ve maden girişi
  parca(new THREE.DodecahedronGeometry(2.6, 0), R.acikTas, -0.8, 1.2, -1.6, g).scale.set(1.3, 0.9, 1);
  parca(new THREE.DodecahedronGeometry(2.4, 0), R.kar, -0.8, 1.9, -1.7, g).scale.set(1.15, 0.45, 0.9);
  kutu(1.6, 1.8, 0.4, R.siyah, -0.6, 0.9, 0.6, g);
  kutu(2.1, 0.3, 0.5, R.koyuTahta, -0.6, 1.95, 0.7, g);
  kutu(0.3, 1.9, 0.4, R.koyuTahta, -1.55, 0.95, 0.7, g); kutu(0.3, 1.9, 0.4, R.koyuTahta, 0.35, 0.95, 0.7, g);
  // Ahşap kule ve çark
  karliKutu(3.2, 0.4, 2.6, R.tahta, 2, 0, 0.6, g);
  [[0.7, -0.3], [3.3, -0.3], [0.7, 1.5], [3.3, 1.5]].forEach(([x, z]) => kutu(0.25, 3.4, 0.25, R.koyuTahta, x, 2.1, z, g));
  karliKutu(3.1, 0.25, 2.3, R.koyuTahta, 2, 3.7, 0.6, g);
  const cark = new THREE.Group();
  parca(new THREE.TorusGeometry(1, 0.12, 6, 16), R.tahta, 0, 0, 0, cark);
  for (let i = 0; i < 4; i++) kutu(2, 0.12, 0.12, R.koyuTahta, 0, 0, 0, cark).rotation.z = i * Math.PI / 4;
  cark.position.set(2, 2.6, 1.85); g.add(cark);
  g.userData.cark = cark;
  // Altın yığınları: seviye arttıkça çoğalır
  const yiginlar = [[3.6, 2.6], [0.6, 2.4], [4.2, 0.2], [-2.6, 1.4], [2.2, 3.1]];
  for (let i = 0; i < Math.min(sv, 5); i++) {
    const [x, z] = yiginlar[i];
    parca(new THREE.ConeGeometry(0.75, 0.75, 7), R.altinParlak, x, 0.37, z, g);
    for (let k = 0; k < 4; k++) parca(new THREE.IcosahedronGeometry(0.18, 0), R.altinParlak, x + Math.cos(k * 1.7) * 0.8, 0.15, z + Math.sin(k * 1.7) * 0.8, g);
  }
  // Maden arabası ve ray
  kutu(0.12, 0.05, 4.5, R.koyuTahta, -0.95, 0.04, 2.6, g); kutu(0.12, 0.05, 4.5, R.koyuTahta, -0.25, 0.04, 2.6, g);
  kutu(1, 0.6, 1.2, R.koyuTahta, -0.6, 0.45, 3, g);
  parca(new THREE.ConeGeometry(0.5, 0.4, 6), R.altinParlak, -0.6, 0.9, 3, g);
  mesale(-2, 0, 1, g, true); mesale(0.9, 0, 1.2, g);
  bayrak(3.3, 3.85, -0.3, g, 1.8);
  return g;
}

const BINA_YAP = { koyBinasi: koyBinasiYap, altinMadeni: altinMadeniYap };
const binaNesneleri = {};
const secimHalkasi = new THREE.Mesh(new THREE.RingGeometry(1, 1.25, 40), new THREE.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
secimHalkasi.rotation.x = -Math.PI / 2; secimHalkasi.visible = false; scene.add(secimHalkasi);

function ustunde(nesne, ata) { for (let n = nesne; n; n = n.parent) if (n === ata) return true; return false; }
function binaKur(id, animasyon = false) {
  const eski = binaNesneleri[id];
  if (eski) {
    scene.remove(eski);
    const kalan = alevler.filter((a) => !ustunde(a.mesh, eski));
    alevler.length = 0; alevler.push(...kalan);
  }
  const g = BINA_YAP[id](durum[id]);
  const [x, z] = BINALAR[id].konum;
  g.position.set(x, 0, z);
  g.userData.bina = id;
  if (animasyon) { g.scale.setScalar(0.01); g.userData.buyume = 0; parlama(x, z); }
  scene.add(g);
  binaNesneleri[id] = g;
}

// =====================================================================
// SÜS: çadırlar, evler, kamp ateşi, surlar, askerler
// =====================================================================
(function susler() {
  const s = new THREE.Group(); scene.add(s);
  // Çadırlar
  [[-4, -1.5, 0.4], [-2, -2.8, -0.3], [6.5, 4.5, 0.8]].forEach(([x, z, r]) => {
    parca(new THREE.ConeGeometry(1.3, 1.7, 4), R.kumas, x, 0.85, z, s).rotation.y = Math.PI / 4 + r;
    parca(new THREE.ConeGeometry(0.95, 0.5, 4), R.kar, x, 1.45, z, s).rotation.y = Math.PI / 4 + r;
  });
  // Evler
  [[7, -5, -0.2], [10.5, -2.5, -0.2]].forEach(([x, z, r]) => {
    const e = new THREE.Group(); e.position.set(x, 0, z); e.rotation.y = r; s.add(e);
    karliKutu(3, 0.4, 3.6, R.tas, 0, 0, 0, e);
    kutu(2.6, 2, 3.2, R.koyuTahta, 0, 1.4, 0, e);
    const cati = parca(new THREE.CylinderGeometry(2.05, 2.05, 3.6, 3), R.tas, 0, 2.95, 0, e);
    cati.rotation.set(0, Math.PI / 2, Math.PI / 2); cati.scale.set(1, 1, 0.8);
    const kar = parca(new THREE.CylinderGeometry(2.1, 2.1, 3.7, 3), R.kar, 0, 3.08, 0, e);
    kar.rotation.set(0, Math.PI / 2, Math.PI / 2); kar.scale.set(0.9, 1, 0.6);
    kutu(0.9, 1.3, 0.08, R.pencere, 0, 1.05, 1.62, e);
    silindir(0.45, 0.45, 0.1, 5, R.siyah, 0, 2.6, 1.62, e).rotation.x = Math.PI / 2;
    silindir(0.3, 0.3, 0.12, 3, R.altin, 0, 2.6, 1.66, e).rotation.x = Math.PI / 2;
    kutu(0.5, 1.3, 0.5, R.koyuTas, 0.8, 3.6, -0.8, e);
  });
  // Kamp ateşi
  for (let i = 0; i < 5; i++) silindir(0.1, 0.1, 1, 5, R.koyuTahta, 1, 0.12, 0.5, s).rotation.set(Math.PI / 2, 0, i * 1.25);
  for (let i = 0; i < 9; i++) parca(new THREE.DodecahedronGeometry(0.16, 0), R.acikTas, 1 + Math.cos(i * 0.7) * 0.65, 0.1, 0.5 + Math.sin(i * 0.7) * 0.65, s);
  const ates = parca(new THREE.ConeGeometry(0.35, 0.9, 7), R.alev, 1, 0.55, 0.5, s); ates.castShadow = false;
  const atesIsik = new THREE.PointLight(new THREE.Color("#ff8a2a"), 2, 10, 2); atesIsik.position.set(1, 1.3, 0.5); s.add(atesIsik);
  alevler.push({ mesh: ates, isik: atesIsik, faz: 0, guclu: true });
  // Atış hedefleri
  [[-3.5, 2.5], [-2.2, 3.4]].forEach(([x, z]) => {
    kutu(0.12, 1.2, 0.12, R.koyuTahta, x, 0.6, z, s);
    [[0.5, R.beyaz], [0.35, R.kirmizi], [0.18, R.beyaz]].forEach(([r, m], i) =>
      silindir(r, r, 0.08, 16, m, x, 1.3, z + 0.08 + i * 0.02, s).rotation.x = Math.PI / 2);
  });
  // Surlar: önde bir avlu
  const [x1, x2, z1, z2] = [-5, 7, 4, 13];
  function sur(ax, az, bx, bz) {
    const d = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.round(d / 1.5));
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const pg = new THREE.Group(); pg.position.set(ax + (bx - ax) * t, 0, az + (bz - az) * t);
      pg.rotation.y = Math.atan2(bx - ax, bz - az); s.add(pg);
      karliKutu(0.8, 1.4, d / n - 0.08, R.tas, 0, 0, 0, pg);
      kutu(0.85, 0.12, d / n, R.altin, 0, 1.1, 0, pg);
    }
  }
  sur(x1, z1, x1, z2); sur(x1, z2, x2, z2); sur(x2, z2, x2, z1); sur(x2, z1, 2.4, z1); sur(-0.4, z1, x1, z1);
  [[x1, z1], [x1, z2], [x2, z2], [x2, z1], [-0.4, z1], [2.4, z1], [1, z2]].forEach(([x, z], i) => {
    karliKutu(1.3, 2.3, 1.3, R.koyuTas, x, 0, z, s);
    kutu(1.36, 0.16, 1.36, R.altin, x, 1.9, z, s);
    silindir(0.3, 0.3, 0.06, 3, R.altin, x, 1.3, z + 0.67, s).rotation.x = Math.PI / 2;
    mesale(x, 2.4, z, s, i === 1 || i === 3);
  });
})();

// Basit askerler (hafifçe hareket ederler)
const askerler = [];
function asker(x, z, okcu, yon) {
  const a = new THREE.Group(); a.position.set(x, 0, z); a.rotation.y = yon;
  const govde = okcu ? mat("#3f5e3a") : R.acikTas;
  silindir(0.18, 0.22, 0.5, 6, R.koyuTahta, 0, 0.25, 0, a);
  silindir(0.22, 0.26, 0.6, 6, govde, 0, 0.75, 0, a);
  parca(new THREE.SphereGeometry(0.17, 8, 6), R.deri, 0, 1.2, 0, a);
  parca(new THREE.ConeGeometry(0.2, 0.25, 6), okcu ? mat("#3f5e3a") : R.koyuTas, 0, 1.38, 0, a);
  if (okcu) parca(new THREE.TorusGeometry(0.3, 0.03, 4, 10, Math.PI), R.tahta, 0.28, 0.85, 0.1, a).rotation.y = Math.PI / 2;
  else { kutu(0.08, 0.5, 0.4, R.siyah, 0.27, 0.8, 0.05, a); kutu(0.05, 0.55, 0.05, R.acikTas, -0.28, 0.9, 0.15, a); }
  scene.add(a); askerler.push({ g: a, faz: Math.random() * 6 });
}
asker(-3, 1.2, true, Math.PI); asker(-1.8, 1.8, true, Math.PI); asker(3, -1, false, 0.6);
asker(4.2, 0.6, false, -0.5); asker(-6.5, 3, false, 2.2); asker(2.5, 6.5, false, 3);

// Yağan kar
const karN = 1400;
const karGeo = new THREE.BufferGeometry();
const karPos = new Float32Array(karN * 3);
for (let i = 0; i < karN; i++) { karPos[i * 3] = (Math.random() - 0.5) * 70; karPos[i * 3 + 1] = Math.random() * 35; karPos[i * 3 + 2] = (Math.random() - 0.5) * 70; }
karGeo.setAttribute("position", new THREE.BufferAttribute(karPos, 3));
scene.add(new THREE.Points(karGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.9, depthWrite: false })));

// Yükseltme parıltısı
const kivilcimlar = [];
function parlama(x, z) {
  for (let i = 0; i < 40; i++) {
    const p = parca(new THREE.OctahedronGeometry(0.15, 0), R.altinParlak, x, 1, z); p.castShadow = false; scene.add(p);
    kivilcimlar.push({ p, v: new THREE.Vector3((Math.random() - 0.5) * 8, 6 + Math.random() * 6, (Math.random() - 0.5) * 8), t: 0 });
  }
}

// =====================================================================
// ETİKETLER VE ETKİLEŞİM
// =====================================================================
const etiketler = {};
for (const id of Object.keys(BINALAR)) {
  const e = document.createElement("div"); e.className = "etiket"; document.body.appendChild(e); etiketler[id] = e;
}
const balon = document.createElement("div"); balon.className = "balon"; document.body.appendChild(balon);
const ETIKET_YUKSEKLIK = { koyBinasi: () => 5.5 + durum.koyBinasi * 1.3, altinMadeni: () => 4.6 };

function ekranKonumu(id) {
  const [x, z] = BINALAR[id].konum;
  const v = new THREE.Vector3(x, ETIKET_YUKSEKLIK[id](), z).project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, gorunur: v.z < 1 };
}
function etiketleriGuncelle() {
  for (const id of Object.keys(BINALAR)) {
    const k = ekranKonumu(id), e = etiketler[id];
    e.style.display = k.gorunur ? "" : "none";
    e.style.left = k.x + "px"; e.style.top = k.y + "px";
    e.textContent = `${BINALAR[id].ad} · Sv ${durum[id]}`;
  }
  const b = bekleyen(), k = ekranKonumu("altinMadeni");
  balon.style.display = b > 0 && k.gorunur ? "" : "none";
  balon.style.left = k.x + "px"; balon.style.top = k.y - 28 + "px";
  balon.textContent = "🪙 " + b;
}

const isin = new THREE.Raycaster(), fare = new THREE.Vector2();
let basla = null;
renderer.domElement.addEventListener("pointerdown", (o) => { basla = { x: o.clientX, y: o.clientY }; });
renderer.domElement.addEventListener("pointerup", (o) => {
  if (!basla || Math.hypot(o.clientX - basla.x, o.clientY - basla.y) > 8) return;
  fare.set(o.clientX / innerWidth * 2 - 1, -(o.clientY / innerHeight) * 2 + 1);
  isin.setFromCamera(fare, camera);
  const vurulan = isin.intersectObjects(Object.values(binaNesneleri), true)[0];
  if (!vurulan) { panelKapat(); return; }
  let n = vurulan.object; while (n && !n.userData.bina) n = n.parent;
  const id = n.userData.bina;
  if (id === "altinMadeni") topla(o);
  sec(id);
});

// =====================================================================
// OYUN İŞLEMLERİ VE PANEL
// =====================================================================
function topla(olay) {
  const miktar = Math.min(bekleyen(), kapasite() - durum.altin);
  if (miktar <= 0) { mesaj(durum.altin >= kapasite() ? "Altın deposu dolu! Köy Binasını yükselt." : "Henüz toplanacak altın yok."); return; }
  durum.altin += miktar; durum.sonToplama = Date.now(); kaydet();
  tg?.HapticFeedback?.impactOccurred("light");
  if (olay) ucanYazi(olay.clientX, olay.clientY, "+" + miktar);
  arayuz();
}
function yukselt(id) {
  const s = sonraki(id);
  if (!s) return;
  if (id !== "koyBinasi" && durum[id] >= durum.koyBinasi) { mesaj("Önce Köy Binasını yükseltmelisin."); return; }
  if (durum.altin < s.maliyet) { mesaj(`Yeterli altın yok. Gerekli: ${s.maliyet} 🪙`); return; }
  if (id === "altinMadeni") topla();
  durum.altin -= s.maliyet; durum[id] += 1; kaydet();
  tg?.HapticFeedback?.notificationOccurred("success");
  binaKur(id, true);
  mesaj(""); arayuz();
}
function mesaj(m) { document.getElementById("mesaj").textContent = m; }
function ucanYazi(x, y, metin) {
  const el = document.createElement("div"); el.className = "ucan"; el.textContent = metin;
  el.style.left = x + "px"; el.style.top = y + "px"; document.body.appendChild(el); setTimeout(() => el.remove(), 1100);
}
function arayuz() {
  document.getElementById("altin").textContent = durum.altin.toLocaleString("tr-TR");
  document.getElementById("kapasite").textContent = kapasite().toLocaleString("tr-TR");
  document.getElementById("altinBar").style.width = Math.min(100, durum.altin / kapasite() * 100) + "%";
  document.getElementById("kbSeviye").textContent = durum.koyBinasi;
  if (secili) panelCiz(secili);
}
function sec(id) {
  secili = id; panelCiz(id);
  document.getElementById("panel").classList.add("acik");
  document.getElementById("ipucu").style.opacity = 0;
  const [x, z] = BINALAR[id].konum;
  secimHalkasi.position.set(x, 0.06, z); secimHalkasi.scale.setScalar(id === "koyBinasi" ? 5.2 : 4); secimHalkasi.visible = true;
}
function panelKapat() { secili = null; secimHalkasi.visible = false; mesaj(""); document.getElementById("panel").classList.remove("acik"); }
document.getElementById("kapat").onclick = panelKapat;

function panelCiz(id) {
  const b = BINALAR[id], s = bilgi(id), n = sonraki(id);
  document.getElementById("pBaslik").textContent = `${b.ad} · Seviye ${durum[id]}`;
  let a = id === "koyBinasi"
    ? `Köyünün kalbi. Altın deposu: ${s.kapasite.toLocaleString("tr-TR")} 🪙. Diğer binalar Köy Binasının seviyesini geçemez.`
    : `Saatte ${s.uretim} 🪙 üretir, en fazla ${s.depo} 🪙 biriktirir. Toplamak için madene dokun.`;
  if (n) a += id === "koyBinasi" ? ` Sonraki seviyede depo: ${n.kapasite.toLocaleString("tr-TR")} 🪙.` : ` Sonraki seviyede: saatte ${n.uretim} 🪙.`;
  document.getElementById("pAciklama").textContent = a;
  const d = document.getElementById("pDugmeler"); d.innerHTML = "";
  const btn = document.createElement("button"); btn.className = "dugme";
  if (n) { btn.textContent = `⬆️ Yükselt · ${n.maliyet.toLocaleString("tr-TR")} 🪙`; btn.disabled = durum.altin < n.maliyet; btn.onclick = () => yukselt(id); }
  else { btn.textContent = "En yüksek seviye 🏆"; btn.disabled = true; }
  d.appendChild(btn);
  if (id === "altinMadeni") {
    const t = document.createElement("button"); t.className = "dugme altin"; t.textContent = "🪙 Topla";
    t.onclick = (o) => topla(o); d.appendChild(t);
  }
}

// =====================================================================
// DÖNGÜ
// =====================================================================
const saat = new THREE.Clock();
let sonArayuz = 0;
function dongu() {
  const dt = Math.min(saat.getDelta(), 0.05), t = saat.elapsedTime;
  controls.update();
  const kb = binaNesneleri.koyBinasi, am = binaNesneleri.altinMadeni;
  if (kb) kb.userData.amblem.rotation.y = t * 0.6;
  if (am) am.userData.cark.rotation.z = -t * 0.8;
  for (const g of [kb, am]) {
    if (g && g.userData.buyume !== undefined && g.userData.buyume < 1) {
      const x = g.userData.buyume = Math.min(1, g.userData.buyume + dt * 2.2);
      g.scale.setScalar(Math.max(0.01, 1 + Math.sin(x * Math.PI) * 0.12 - (1 - x) * (1 - x) * 0.9));
    }
  }
  for (const a of alevler) {
    const f = 0.85 + Math.sin(t * 13 + a.faz) * 0.1 + Math.random() * 0.08;
    a.mesh.scale.set(f, 0.9 + Math.random() * 0.25, f);
    if (a.isik) a.isik.intensity = (a.guclu ? 2 : 1.2) * (0.85 + Math.random() * 0.25);
  }
  for (const s of askerler) s.g.position.y = Math.abs(Math.sin(t * 2 + s.faz)) * 0.06;
  const p = karGeo.attributes.position.array;
  for (let i = 0; i < karN; i++) {
    p[i * 3 + 1] -= dt * (1.2 + (i % 5) * 0.25);
    p[i * 3] += Math.sin(t + i) * dt * 0.3;
    if (p[i * 3 + 1] < 0) p[i * 3 + 1] = 35;
  }
  karGeo.attributes.position.needsUpdate = true;
  for (let i = kivilcimlar.length - 1; i >= 0; i--) {
    const k = kivilcimlar[i]; k.t += dt; k.v.y -= 18 * dt;
    k.p.position.addScaledVector(k.v, dt); k.p.rotation.x += dt * 8;
    if (k.t > 1.4) { scene.remove(k.p); kivilcimlar.splice(i, 1); }
  }
  if (secimHalkasi.visible) secimHalkasi.material.opacity = 0.55 + Math.sin(t * 5) * 0.3;
  if (t - sonArayuz > 1) { sonArayuz = t; arayuz(); }
  etiketleriGuncelle();
  renderer.render(scene, camera);
  requestAnimationFrame(dongu);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

yukle(() => {
  binaKur("koyBinasi"); binaKur("altinMadeni");
  arayuz(); dongu();
  const y = document.getElementById("yukleniyor"); y.style.opacity = 0; setTimeout(() => y.remove(), 500);
  setTimeout(() => { document.getElementById("ipucu").style.opacity = 0; }, 6000);
});
</script>
